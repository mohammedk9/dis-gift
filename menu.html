<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنيو | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<meta name="theme-color" content="#e86a33">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  /* ===== الهوية البرتقالية (متوافقة مع بقية الصفحات) ===== */
  :root{
    --orange:#e86a33; --orange-deep:#d9531a; --orange-text:#b94110; --orange-light:#f7a05f;
    --peach:#fdeee3; --peach-2:#fbe0cd; --cream:#fff8f1;
    --grad:linear-gradient(135deg,#f7a05f 0%,#ee6f33 48%,#d9531a 100%);
    --shadow-or:0 18px 38px -16px rgba(226,85,31,.55);
    --card-shadow:0 1px 2px rgba(26,19,14,.04),0 12px 32px -18px rgba(26,19,14,.16);
  }
  [hidden]{display:none !important}
  body{font-family:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
       background:linear-gradient(180deg,var(--cream) 0,#fff 360px) no-repeat,#fff}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid #f3e9dd}
  header.nav::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--orange-light),var(--orange),var(--orange-light),transparent);opacity:.55}
  header.nav .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow-or);font-size:0;flex:none}
  .brand-text{display:flex;flex-direction:column}
  .brand-name{font-size:20px;font-weight:700;line-height:1.1}
  .brand-sub{font-size:12px;color:#867b71;line-height:1.4}
  #discBadge{background:var(--grad);color:#fff;border:0;font-weight:700;font-size:13px;
    padding:7px 14px;border-radius:999px;box-shadow:0 10px 22px -12px rgba(226,85,31,.8)}
  #discBadge:empty{display:none}

  /* بطاقة المنشأة */
  .shop-card{margin-top:14px;border-radius:24px;border:1px solid #f1e7da;background:#fff;padding:16px;
    box-shadow:var(--card-shadow)}
  .shop-card img{box-shadow:0 8px 18px -10px rgba(26,19,14,.4)}
  .shop-ph{width:58px;height:58px;border-radius:16px;background:var(--peach);color:var(--orange-deep);
    display:grid;place-items:center;flex:none;border:1px solid var(--peach-2)}

  /* الأصناف */
  .mcat{margin-top:22px}
  .mcat-name{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px;font-weight:700}
  .mcat-name::before{content:"";width:5px;height:20px;border-radius:99px;background:var(--grad);flex:none}
  .mitem{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #f1e7da;border-radius:20px;
    padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(26,19,14,.04);transition:.2s}
  .mitem:hover{border-color:var(--peach-2);box-shadow:0 14px 28px -20px rgba(226,85,31,.45)}
  .mitem-info{flex:1;min-width:0}
  .mitem-name{margin:0;font-weight:600;font-size:15px;line-height:1.5}
  .mitem-desc{margin:2px 0 0;color:#6f655c;font-size:12.5px;line-height:1.7}
  .mitem-price{margin-top:6px;color:var(--orange-text);font-weight:700;font-size:14.5px}
  .mitem.out{opacity:.6}
  .mitem.out .mitem-price::after{content:" · غير متوفر";color:#6f655c;font-weight:500;font-size:12.5px}
  .mitem.out .qty button{pointer-events:none;background:#eee;color:#8a8178;box-shadow:none}

  /* أزرار الكمية */
  .mitem .qty{display:flex;align-items:center;gap:8px;flex:none}
  .mitem .qty button{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
    border:0;font:inherit;font-weight:700;transition:.2s}
  .mitem .qty span{min-width:22px;text-align:center;font-weight:700;font-size:15px}
  .mitem .qty button[data-act="add"]{background:var(--peach);color:var(--orange-text);border:1px solid var(--peach-2);
    border-radius:12px;padding:9px 14px;font-size:13.5px}
  .mitem .qty button[data-act="add"]:hover{background:var(--grad);color:#fff;border-color:transparent}
  .mitem .qty button[data-act="inc"],.mitem .qty button[data-act="dec"]{width:34px;height:34px;border-radius:50%;padding:0}
  .mitem .qty button[data-act="inc"]{background:var(--grad);color:#fff;box-shadow:0 8px 16px -8px rgba(226,85,31,.8)}
  .mitem .qty button[data-act="dec"]{background:#fff;color:var(--orange-text);border:1px solid var(--peach-2)}
  .mitem .qty button[data-act="dec"]:hover{background:var(--peach)}

  /* شريط السلة */
  .cart-bar{border-radius:20px;border:1px solid #f1e7da;box-shadow:0 24px 50px -22px rgba(226,85,31,.55)}
  .cart-bar .sub{color:#6f655c;font-size:12.5px}
  .cart-bar .total{color:var(--orange-text);font-weight:700;font-size:19px}
  .cart-bar .btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--grad);border:0;color:#fff;
    border-radius:14px;font-weight:700;box-shadow:var(--shadow-or);transition:.2s}
  .cart-bar .btn-primary:hover{transform:translateY(-2px)}

  /* حالات فارغة */
  .state-card{margin-top:14px;border-radius:26px;border:1px solid #f1e7da;background:#fff;padding:34px 22px;
    text-align:center;box-shadow:var(--card-shadow)}
  .state-ico{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;background:var(--peach);
    color:var(--orange-deep);display:grid;place-items:center;border:1px solid var(--peach-2)}
  .state-card p{color:#6f655c;font-size:14.5px;margin:6px 0 0}
  .state-btn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:#fff;color:var(--orange-text);border:1px solid var(--peach-2);border-radius:14px;
    padding:12px 24px;font-size:14.5px;font-weight:600;transition:.2s}
  .state-btn:hover{background:var(--peach);border-color:var(--orange-light)}

  a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:10px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="gift.html">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
      </svg>
    </span>
    <span class="brand-text"><span class="brand-name">هدية</span><span class="brand-sub">اكتشف · اطلب</span></span>
  </a>
  <span class="nav-spacer"></span>
  <span class="badge badge-orange" id="discBadge"></span>
</div></header>

<main class="container page" id="app"></main>
<div id="cartbar"></div>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, getGift, getCart, setQty, cartTotal, sar } from './assets/js/core.js';
import { $, esc, toast, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

document.body.insertAdjacentHTML('beforeend', customerNav('gift'));
if (!requireConfig()) throw new Error('not configured');

/* أيقونات SVG بدل الإيموجي */
const svg = (inner, s = 20, sw = 1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  utensils: (s, sw) => svg(`<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>`, s, sw),
  list:     (s, sw) => svg(`<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>`, s, sw),
  plus:     (s, sw) => svg(`<path d="M12 5v14M5 12h14"/>`, s, sw),
  minus:    (s, sw) => svg(`<path d="M5 12h14"/>`, s, sw),
  cart:     (s, sw) => svg(`<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>`, s, sw),
  arrow:    (s, sw) => svg(`<path d="M19 12H5M11 18l-6-6 6-6"/>`, s, sw)
};

const gift = getGift();
if (!gift) { location.replace('gift.html'); throw new Error('no gift'); }

const rid = gift.restaurant.id;
$('#discBadge').textContent = `خصم ${gift.gift.discount}%`;

const { data: menu } = await sb.rpc('restaurant_menu', { p_restaurant: rid });
if (!menu?.restaurant) {
  $('#app').innerHTML = `<div class="state-card"><div class="state-ico">${ICON.utensils(32, 1.6)}</div>
    <p>هذه المنشأة غير متاحة حالياً.</p>
    <a class="state-btn" href="gift.html">العودة للهدية</a></div>`;
  throw new Error('no restaurant');
}

sb.rpc('log_event', {
  p_type: 'menu_view', p_device: deviceId(), p_restaurant: rid, p_gift: gift.gift.id
}).catch(() => {});

const R = menu.restaurant;
$('#app').innerHTML = `
  <div class="shop-card">
    <div class="flex" style="gap:12px;align-items:center">
      ${R.logo_url ? `<img src="${esc(R.logo_url)}" alt=""
        style="width:58px;height:58px;border-radius:15px;object-fit:cover;flex:none">`
        : `<div class="shop-ph">${ICON.utensils(28, 1.6)}</div>`}
      <div class="grow">
        <div style="font-weight:700;font-size:17px">${esc(R.name)}</div>
        <div class="small muted">${esc(R.address || 'بريدة')}</div>
        <div class="flex" style="gap:6px;margin-top:5px;flex-wrap:wrap">
          ${R.pickup_enabled ? '<span class="badge badge-green">استلام</span>' : ''}
          ${R.delivery_enabled ? `<span class="badge badge-blue">توصيل المنشأة${
            Number(R.delivery_fee) > 0 ? ' · ' + sar(R.delivery_fee) : ' · بلا رسوم'}</span>` : ''}
          <span class="badge">~${esc(R.prep_time_min)} دقيقة</span>
        </div>
      </div>
    </div>
  </div>

  <div id="menu"></div>`;

const menuEl = $('#menu');
menuEl.innerHTML = menu.categories.length ? menu.categories.map(c => (
  !c.items.length ? '' : `
  <div class="mcat">
    <h3 class="mcat-name">${esc(c.name)}</h3>
    ${c.items.map(it => `
      <div class="mitem ${it.is_available ? '' : 'out'}" data-id="${it.id}">
        ${it.image_url ? `<img src="${esc(it.image_url)}" alt=""
          style="width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none">` : ''}
        <div class="mitem-info">
          <p class="mitem-name">${esc(it.name)}</p>
          ${it.description ? `<p class="mitem-desc">${esc(it.description)}</p>` : ''}
          <div class="mitem-price">${sar(it.price)}</div>
        </div>
        <div class="qty" data-q="${it.id}">${qtyHtml(it.id)}</div>
      </div>`).join('')}
  </div>`)).join('')
  : `<div class="state-card"><div class="state-ico">${ICON.list(32, 1.6)}</div><p>لا يوجد منيو متاح حالياً.</p></div>`;

function qtyHtml(id) {
  const it = getCart().find(x => x.id === id);
  return it ? `<button data-act="dec" aria-label="إنقاص">${ICON.minus(16, 2.4)}</button><span>${it.qty}</span><button data-act="inc" aria-label="زيادة">${ICON.plus(16, 2.4)}</button>`
            : `<button data-act="add">${ICON.plus(15, 2.4)} إضافة</button>`;
}

/* ---------- تفاعل السلة ---------- */
const ALL = menu.categories.flatMap(c => c.items);
let loggedCart = false;

menuEl.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const qbox = btn.closest('.qty');
  const id = qbox.dataset.q;
  const act = btn.dataset.act;
  const src = ALL.find(x => x.id === id);
  if (!src?.is_available) return toast('هذا الصنف غير متوفر حالياً');

  if (act === 'dec') {
    setQty(id, (getCart().find(x => x.id === id)?.qty || 0) - 1);
  } else {
    const list = getCart();
    const cur = list.find(x => x.id === id);
    if (cur) cur.qty += 1; else list.push({ ...src, qty: 1 });
    localStorage.setItem('hg_cart', JSON.stringify(list));
  }

  qbox.innerHTML = qtyHtml(id);
  renderBar();

  if (!loggedCart && getCart().length) {
    loggedCart = true;
    sb.rpc('log_event', {
      p_type: 'cart_created', p_device: deviceId(), p_restaurant: rid, p_gift: gift.gift.id
    }).catch(() => {});
  }
});

function giftLabel() {
  const g = gift.gift;
  if (g.kind === 'free_item') return esc(g.gift_label || 'صنف مجاني');
  if (g.kind === 'fixed_amount') return `هدية ${esc(g.discount)} ر.س`;
  return `خصم ${esc(g.discount)}%`;
}

function renderBar() {
  const c = getCart();
  const el = $('#cartbar');
  if (!c.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="cart-bar">
    <div class="grow">
      <div class="sub">${c.reduce((s,i)=>s+i.qty,0)} صنف · ${giftLabel()}${
        gift.gift.code ? ' · كود ' + esc(gift.gift.code) : ''}</div>
      <div class="total">${sar(cartTotal())}</div>
    </div>
    <button class="btn btn-primary" id="checkout">إتمام الطلب ${ICON.arrow(18, 2.2)}</button>
  </div>`;
  $('#checkout').onclick = () => { location.href = 'checkout.html'; };
}
renderBar();
initPWA();
</script>
</body>
</html>
