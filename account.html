<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابي | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<meta name="theme-color" content="#e86a33">
<style>
  /* ===== الهوية البرتقالية (متوافقة مع الصفحة الرئيسية وصفحة الهدية) ===== */
  :root{
    --orange:#e86a33; --orange-deep:#d9531a; --orange-text:#b94110; --orange-light:#f7a05f;
    --peach:#fdeee3; --peach-2:#fbe0cd; --cream:#fff8f1;
    --grad:linear-gradient(135deg,#f7a05f 0%,#ee6f33 48%,#d9531a 100%);
    --shadow-or:0 18px 38px -16px rgba(226,85,31,.55);
    --card-shadow:0 1px 2px rgba(26,19,14,.04),0 12px 32px -18px rgba(26,19,14,.16);
  }
  body{font-family:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
       background:linear-gradient(180deg,var(--cream) 0,#fff 360px) no-repeat,#fff}

  /* الهيدر */
  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid #f3e9dd}
  header.nav::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--orange-light),var(--orange),var(--orange-light),transparent);opacity:.55}
  header.nav .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow-or);font-size:0;flex:none}
  .brand-text{display:flex;flex-direction:column}
  .brand-name{font-size:20px;font-weight:700;line-height:1.1}
  .brand-sub{font-size:12px;color:#867b71;line-height:1.4}

  /* رأس الحساب */
  .profile-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;color:#fff;
    background:var(--grad);border-radius:28px;padding:22px 22px;
    box-shadow:0 30px 60px -28px rgba(226,96,40,.65),0 0 0 6px rgba(255,255,255,.7)}
  .profile-hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;
    border:1px solid rgba(255,255,255,.22);left:-90px;top:-100px;pointer-events:none;
    box-shadow:0 0 0 36px rgba(255,255,255,.05),0 0 0 72px rgba(255,255,255,.04)}
  .profile-hero > *{position:relative;z-index:1}
  .ph-avatar{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .ph-name{margin:0;font-size:21px;font-weight:700;line-height:1.4}
  .ph-sub{margin:2px 0 0;font-size:13.5px;color:rgba(255,255,255,.92)}
  .ph-note{margin:14px 4px 0;text-align:center;color:#6f655c;font-size:13.5px}

  /* البطاقات */
  .acc-card{margin-top:18px;border-radius:24px;border:1px solid #f1e7da;background:#fff;padding:20px;box-shadow:var(--card-shadow)}
  .acc-title{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:16.5px;font-weight:700}
  .acc-ico{width:36px;height:36px;border-radius:12px;background:var(--peach);color:var(--orange-deep);
    display:grid;place-items:center;flex:none;border:1px solid var(--peach-2)}
  .acc-card .field{margin-bottom:14px}
  .acc-card .label{font-weight:600;font-size:13.5px;color:#3a332e}
  .acc-card .input{border-radius:14px;border:1px solid #eadfd1;background:var(--cream);transition:.2s}
  .acc-card .input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(232,106,51,.14)}
  .acc-card .hint{color:#6f655c}

  .save-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:6px;
    border:0;cursor:pointer;background:var(--grad);color:#fff;border-radius:16px;padding:15px;
    font:inherit;font-size:16px;font-weight:700;box-shadow:var(--shadow-or);transition:.2s}
  .save-btn:hover{transform:translateY(-2px);box-shadow:0 22px 40px -16px rgba(226,85,31,.7)}

  /* سجل الموافقات */
  .consent-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
    border-radius:16px;background:var(--cream);margin-bottom:8px}
  .consent-row b{font-weight:600;font-size:14px;display:block}
  .consent-row small{color:#6f655c;font-size:12px}
  .empty-note{display:flex;align-items:center;gap:10px;margin:0;padding:14px;border-radius:16px;
    background:var(--cream);color:#6f655c;font-size:14px}
  .empty-note svg{color:var(--orange);flex:none}
  .legal-hint{margin:12px 2px 0;color:#6f655c;font-size:12.5px;line-height:1.9}

  /* للمنشآت */
  .biz-card{position:relative;overflow:hidden;margin-top:18px;border-radius:24px;padding:22px;color:#fff;
    background:var(--grad);box-shadow:0 26px 50px -26px rgba(226,96,40,.65)}
  .biz-card::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);right:-80px;bottom:-110px;
    box-shadow:0 0 0 34px rgba(255,255,255,.06),0 0 0 68px rgba(255,255,255,.04)}
  .biz-card > *{position:relative}
  .biz-card h3{margin:0;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
  .biz-card p{margin:8px 0 16px;color:rgba(255,255,255,.93);font-size:14px;line-height:1.9}
  .biz-btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    background:#fff;color:var(--orange-text);border-radius:15px;padding:14px;font-weight:700;font-size:15px;
    box-shadow:0 12px 26px -10px rgba(0,0,0,.4);transition:.2s}
  .biz-btn:hover{transform:translateY(-2px)}

  /* منطقة الخطر */
  .danger-card{margin-top:18px;border-radius:24px;border:1px solid #f6d9d4;background:#fffaf9;padding:20px}
  .danger-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;cursor:pointer;
    background:#fff;color:#c0392b;border:1px solid #f0c4bd;border-radius:15px;padding:14px;
    font:inherit;font-size:15px;font-weight:600;transition:.2s}
  .danger-btn:hover{background:#c0392b;color:#fff;border-color:#c0392b}
  .danger-hint{margin:12px 0 0;text-align:center;color:#6f655c;font-size:12.5px}

  a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:10px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="gift.html">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
      </svg>
    </span>
    <span class="brand-text"><span class="brand-name">هدية</span><span class="brand-sub">حسابي</span></span>
  </a>
</div></header>
<main class="container page" id="app"></main>
<div id="nav"></div>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, areaId, setArea, dt } from './assets/js/core.js';
import { $, esc, toast, confirmBox, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

$('#nav').innerHTML = customerNav('more');
if (!requireConfig()) throw new Error('not configured');

/* أيقونات SVG بدل الإيموجي */
const svg = (inner, s = 20, sw = 1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  user:   (s, sw) => svg(`<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>`, s, sw),
  shield: (s, sw) => svg(`<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>`, s, sw),
  building: (s, sw) => svg(`<path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>`, s, sw),
  trash:  (s, sw) => svg(`<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>`, s, sw),
  check:  (s, sw) => svg(`<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>`, s, sw),
  arrow:  (s, sw) => svg(`<path d="M19 12H5M11 18l-6-6 6-6"/>`, s, sw),
  info:   (s, sw) => svg(`<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>`, s, sw)
};

const { data: areas } = await sb.rpc('active_areas');
const { data: consents } = await sb.rpc('customer_consents', { p_device: deviceId() });

const savedName = (localStorage.getItem('hg_name') || '').trim();
const areaName = id => ((areas || []).find(a => a.id === id) || {}).name || 'كل بريدة';

$('#app').innerHTML = `
  <div class="page-head" style="margin-bottom:18px">
    <div class="profile-hero">
      <div class="ph-avatar">${ICON.user(34, 1.6)}</div>
      <div>
        <p class="ph-name" id="pv_name">${esc(savedName || 'حسابي')}</p>
        <p class="ph-sub" id="pv_area">${esc(areaName(areaId()))}</p>
      </div>
    </div>
    <p class="ph-note">لا نطلب إلا ما نحتاجه لتنفيذ طلبك</p>
  </div>

  <div class="acc-card">
    <h3 class="acc-title"><span class="acc-ico">${ICON.user(19)}</span> بياناتي</h3>
    <div class="field"><label class="label">الاسم</label>
      <input class="input" id="p_name" value="${esc(localStorage.getItem('hg_name') || '')}"></div>
    <div class="field"><label class="label">رقم الجوال</label>
      <input class="input" id="p_phone" inputmode="tel"
        value="${esc(localStorage.getItem('hg_phone') || '')}" placeholder="05xxxxxxxx">
      <p class="hint">يُشارك مع المنشأة فقط عند موافقتك على ذلك في الطلب.</p></div>
    <div class="field"><label class="label">الحي</label>
      <select class="input" id="p_area">
        <option value="">كل بريدة</option>
        ${(areas || []).map(a => `<option value="${a.id}"
          ${areaId() === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
      </select></div>
    <button class="save-btn" id="saveProfile" type="button">${ICON.check(19, 2)} حفظ</button>
  </div>

  <div class="acc-card">
    <h3 class="acc-title"><span class="acc-ico">${ICON.shield(19)}</span> سجل الموافقات</h3>
    ${(consents || []).length ? (consents || []).map(c => `
      <div class="consent-row">
        <div>
          <b>${esc(c.restaurant || 'المنصة')} ·
            ${c.type === 'marketing' ? 'تسويق' : 'تواصل بخصوص الطلب'}</b>
          <small>${dt(c.at)} · سياسة ${esc(c.policy_version)}</small>
        </div>
        <span class="badge ${c.status === 'granted' ? 'badge-green' : 'badge-red'}">
          ${c.status === 'granted' ? 'موافق' : 'مُسحب'}</span>
      </div>`).join('')
    : `<p class="empty-note">${ICON.info(19)} لا توجد موافقات مسجلة بعد.</p>`}
    <p class="legal-hint">تُسجَّل كل موافقة بنوعها ووقتها ونسخة السياسة.
      المتطلبات النظامية <span class="badge badge-orange">تحتاج تحققاً رسمياً</span></p>
  </div>

  <div class="biz-card">
    <h3>${ICON.building(22)} للمنشآت</h3>
    <p>هل تملك منشأة محلية؟ سجّل بياناتك وابدأ بإضافة عروضك بعد التفعيل.</p>
    <a class="biz-btn" href="login.html?join=1">سجّل منشأتك أو ادخل إلى لوحتك ${ICON.arrow(18, 2.2)}</a>
  </div>

  <div class="danger-card">
    <button class="danger-btn" id="reset" type="button">${ICON.trash(18, 1.9)} مسح بيانات هذا الجهاز</button>
    <p class="danger-hint">سيمسح الطلبات المحلية والهدية المخزنة على هذا المتصفح فقط.</p>
  </div>`;

$('#saveProfile').onclick = () => {
  localStorage.setItem('hg_name', $('#p_name').value.trim());
  localStorage.setItem('hg_phone', $('#p_phone').value.trim());
  setArea($('#p_area').value);
  $('#pv_name').textContent = $('#p_name').value.trim() || 'حسابي';
  $('#pv_area').textContent = areaName($('#p_area').value);
  toast('تم الحفظ');
};

$('#reset').onclick = async () => {
  if (!await confirmBox('مسح البيانات؟',
    'سيتم مسح الطلبات والهدية المحفوظة على هذا المتصفح.', 'مسح')) return;
  ['hg_cart','hg_gift','hg_name','hg_phone','hg_addr','hg_area'].forEach(k => localStorage.removeItem(k));
  toast('تم المسح');
  setTimeout(() => location.href = 'gift.html', 500);
};
initPWA();
</script>
</body>
</html>
