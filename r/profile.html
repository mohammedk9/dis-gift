<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملف المنشأة | لوحة المنشأة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/r/"><span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">ملف المنشأة</span></span></a>
</div></header>
<div id="tabs"></div>
<main class="container" id="app" style="padding-bottom:40px"></main>
<script src="../assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb } from '../assets/js/core.js';
import { $, esc, toast, requireConfig, guardStaff } from '../assets/js/ui.js';

if (!requireConfig()) throw new Error('not configured');
const auth = await guardStaff();
if (!auth) throw new Error('unauthorized');

$('#tabs').innerHTML = `<div class="container"><div class="tabs">
  ${[['d','اللوحة','/r/'],['o','الطلبات','/r/orders.html'],['m','المنيو','/r/menu.html'],
     ['f','العروض','/r/offers.html'],['s','كشف الحساب','/r/statement.html'],
     ['p','الملف','/r/profile.html']].map(([k,l,h]) =>
    `<a class="tab ${k==='p'?'active':''}" href="${h}">${l}</a>`).join('')}
</div></div>`;

const rid = auth.restaurantId;
const { data: r } = await sb.from('restaurants').select('*').eq('id', rid).maybeSingle();
const { data: areas } = await sb.rpc('active_areas');
const { data: slots } = await sb.from('pickup_slots')
  .select('slot_time').eq('restaurant_id', rid).eq('is_active', true).order('slot_time');

const slotStr = (slots || []).map(s => s.slot_time.slice(0, 5)).join(', ');

$('#app').innerHTML = `
  <div class="page-head"><h1 class="page-title">ملف المنشأة</h1></div>

  <div class="card">
    <div class="field"><label class="label">نوع النشاط</label>
      <select class="input" id="f_biz">
        ${[['restaurant','🍽️ مطعم'],['cafe','☕ كافيه'],['salon','💇 صالون'],
           ['store','🏪 متجر'],['services','🛠️ خدمات'],['other','📦 أخرى']]
          .map(([v, l]) => `<option value="${v}" ${r?.business_type === v ? 'selected' : ''}
            >${l}</option>`).join('')}
      </select>
      <p class="hint">المنصة ليست حصراً على المطاعم — أي منشأة محلية يمكنها المشاركة.</p>
    </div>
    <div class="field"><label class="label">اسم المنشأة</label>
      <input class="input" id="f_name" value="${esc(r?.name || '')}"></div>
    <div class="field"><label class="label">رقم الجوال</label>
      <input class="input" id="f_phone" inputmode="tel" value="${esc(r?.phone || '')}"></div>
    <div class="field"><label class="label">العنوان</label>
      <input class="input" id="f_addr" value="${esc(r?.address || '')}"></div>
    <div class="field"><label class="label">الحي</label>
      <select class="input" id="f_area"><option value="">— اختر —</option>
        ${(areas || []).map(a => `<option value="${a.id}"
          ${r?.area_id === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
      </select>
      <p class="hint">الحي يحدد أي العملاء سيرون عروضك.</p></div>
    <div class="field"><label class="label">وصف قصير</label>
      <textarea class="input" id="f_desc">${esc(r?.description || '')}</textarea></div>
    <div class="row2">
      <div class="field"><label class="label">رابط الشعار</label>
        <input class="input" id="f_logo" value="${esc(r?.logo_url || '')}"></div>
      <div class="field"><label class="label">رابط صورة الغلاف</label>
        <input class="input" id="f_cover" value="${esc(r?.cover_url || '')}"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="label">وقت التحضير (دقيقة)</label>
        <input class="input" id="f_prep" inputmode="numeric" value="${r?.prep_time_min || 20}"></div>
      <div class="field"><label class="label">أقل قيمة طلب (ر.س)</label>
        <input class="input" id="f_min" inputmode="decimal"
          value="${Number(r?.min_order_total || 0)}"></div>
    </div>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">الاستلام والتوصيل</h3>
    <label class="check"><input type="checkbox" id="f_pickup"
      ${r?.pickup_enabled ? 'checked' : ''}> استلام من Premises</label>
    <label class="check"><input type="checkbox" id="f_delivery"
      ${r?.delivery_enabled ? 'checked' : ''}> توصيل من Premises</label>
    <p class="hint">المنصة لا تقوم بالتوصيل. «توصيل من Premises» يعني أن المنشأة هي من ينفّذ التوصيل.</p>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">أوقات الاستلام</h3>
    <div class="field"><label class="label">الأوقات (مفصولة بفاصلة)</label>
      <input class="input" id="f_slots" value="${esc(slotStr)}"
        placeholder="12:00, 12:30, 13:00"></div>
    <p class="hint">اتركها فارغة إذا كنت لا تريد تحديد أوقات. العميل سيتواصل معك بدل اختيار وقت.</p>
  </div>

  <button class="btn btn-primary btn-block btn-lg mt" id="save">حفظ التغييرات</button>

  <div class="card mt">
    <button class="btn btn-ghost btn-block" id="logout">تسجيل الخروج</button>
    <a class="btn btn-ghost btn-block mt" href="/login.html?next=/admin/">دخول الإدارة</a>
  </div>`;

$('#save').onclick = async () => {
  await sb.from('restaurants').update({
    business_type: $('#f_biz').value,
    name: $('#f_name').value.trim(),
    phone: $('#f_phone').value.trim(),
    address: $('#f_addr').value.trim(),
    area_id: $('#f_area').value ? Number($('#f_area').value) : null,
    description: $('#f_desc').value.trim() || null,
    logo_url: $('#f_logo').value.trim() || null,
    cover_url: $('#f_cover').value.trim() || null,
    prep_time_min: Number($('#f_prep').value) || 20,
    pickup_enabled: $('#f_pickup').checked,
    delivery_enabled: $('#f_delivery').checked
  }).eq('id', rid);
  await sb.from('restaurants')
    .update({ min_order_total: Number($('#f_min').value) || 0 }).eq('id', rid);

  const list = $('#f_slots').value.split(',').map(s => s.trim()).filter(Boolean);
  await sb.rpc('set_pickup_slots', { p_slots: list });
  toast('✅ تم الحفظ');
};

$('#logout').onclick = async () => { await sb.auth.signOut(); location.href = '/login.html'; };
</script>
</body>
</html>
