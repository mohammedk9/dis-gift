<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملف المنشأة | لوحة المنشأة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="./"><span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">ملف المنشأة</span></span></a>
</div></header>
<div id="tabs"></div>
<main class="container" id="app" style="padding-bottom:40px"></main>
<script src="../assets/js/runtime-config-live.js"></script>
<script src="../assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, sar } from '../assets/js/core.js';
import { $, esc, toast, requireConfig, guardStaff } from '../assets/js/ui.js';
import { localNormalizeWhatsapp, whatsappDisplay } from '../assets/js/whatsapp.js';

if (!requireConfig()) throw new Error('not configured');
const auth = await guardStaff({ allowAdmin: false });
if (!auth) throw new Error('unauthorized');

$('#tabs').innerHTML = `<div class="container"><div class="tabs">
  ${[['d','اللوحة','./'],['o','الطلبات','./orders.html'],['m','المنيو','./menu.html'],
     ['f','العروض','./offers.html'],['c','مسح الباركود','./scan.html'],
     ['s','كشف الحساب','./statement.html'],
     ['p','الملف','./profile.html']].map(([k,l,h]) =>
    `<a class="tab ${k==='p'?'active':''}" href="${h}">${l}</a>`).join('')}
</div></div>`;

const rid = auth.restaurantId;
const { data: r } = await sb.from('restaurants').select('*').eq('id', rid).maybeSingle();
const { data: areas } = await sb.rpc('active_areas');
const { data: slots } = await sb.from('pickup_slots')
  .select('slot_time').eq('restaurant_id', rid).eq('is_active', true).order('slot_time');

const slotStr = (slots || []).map(s => s.slot_time.slice(0, 5)).join(', ');

/* الحد الأعلى لرسوم التوصيل يحدده الأدمن في الإعدادات (السيرفر يتحقق منه أيضاً) */
const { data: capRow } = await sb.from('app_settings').select('value')
  .eq('key', 'delivery_fee_max').maybeSingle();
const feeMax = Number(capRow?.value ?? 0);

/* الحد الأعلى للنقاط يحدده الأدمن (السيرفر يتحقق منه أيضاً) */
const { data: pcapRow } = await sb.from('app_settings').select('value')
  .eq('key', 'points_hard_cap').maybeSingle();
const pointsCap = Number(pcapRow?.value ?? 0);

$('#app').innerHTML = `
  <div class="page-head"><h1 class="page-title">ملف المنشأة</h1></div>

  <div class="card">
    <div class="field"><label class="label">نوع النشاط</label>
      <select class="input" id="f_biz">
        ${[['restaurant','🍽️ مطعم'],['cafe','☕ كافيه'],['salon','💇 صالون'],
           ['store','🏪 متجر'],['services','🛠️ خدمات'],['other','📦 أخرى']]
          .map(([v, l]) => `<option value="${v}" ${r?.business_type === v ? 'selected' : ''}
            >${l}</option>`).join('')}
      </select>
      <p class="hint">المنصة ليست حصراً على المطاعم — أي منشأة محلية يمكنها المشاركة.</p>
    </div>
    <div class="field"><label class="label">اسم المنشأة</label>
      <input class="input" id="f_name" value="${esc(r?.name || '')}"></div>
    <div class="field"><label class="label">رقم الجوال</label>
      <input class="input" id="f_phone" inputmode="tel" value="${esc(r?.phone || '')}"></div>
    <div class="field"><label class="label">العنوان</label>
      <input class="input" id="f_addr" value="${esc(r?.address || '')}"></div>
    <div class="field"><label class="label">الحي</label>
      <select class="input" id="f_area"><option value="">— اختر —</option>
        ${(areas || []).map(a => `<option value="${a.id}"
          ${r?.area_id === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
      </select>
      <p class="hint">الحي يحدد أي العملاء سيرون عروضك.</p></div>
    <div class="field"><label class="label">وصف قصير</label>
      <textarea class="input" id="f_desc">${esc(r?.description || '')}</textarea></div>
    <div class="row2">
      <div class="field"><label class="label">رابط الشعار</label>
        <input class="input" id="f_logo" value="${esc(r?.logo_url || '')}"></div>
      <div class="field"><label class="label">رابط صورة الغلاف</label>
        <input class="input" id="f_cover" value="${esc(r?.cover_url || '')}"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="label">وقت التحضير (دقيقة)</label>
        <input class="input" id="f_prep" inputmode="numeric" value="${r?.prep_time_min || 20}"></div>
      <div class="field"><label class="label">أقل قيمة طلب (ر.س)</label>
        <input class="input" id="f_min" inputmode="decimal"
          value="${Number(r?.min_order_total || 0)}"></div>
    </div>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">الاستلام والتوصيل</h3>
    <label class="check"><input type="checkbox" id="f_pickup"
      ${r?.pickup_enabled ? 'checked' : ''}> استلام من المنشأة</label>
    <label class="check"><input type="checkbox" id="f_delivery"
      ${r?.delivery_enabled ? 'checked' : ''}> توصيل من المنشأة</label>
    <p class="hint">المنصة لا تقوم بالتوصيل. التوصيل تنفذه المنشأة نفسها.</p>
    <div class="field"><label class="label">رسوم التوصيل لكل طلب (ر.س)</label>
      <input class="input" id="f_dfee" inputmode="decimal"
        value="${Number(r?.delivery_fee || 0)}" ${r?.delivery_enabled ? '' : 'disabled'}>
      <p class="hint" id="f_dfee_hint">تحددها أنت لكل طلب توصيل، والعميل يراها قبل الطلب
        ويؤكدها. الحد الأعلى من الإدارة: ${sar(feeMax)}. الرسوم تُحصَّل لك كاملة —
        رسوم المنصة الثابتة تُحسب على قيمة الطلب بلا التوصيل.</p></div>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">أوقات الاستلام</h3>
    <div class="field"><label class="label">الأوقات (مفصولة بفاصلة)</label>
      <input class="input" id="f_slots" value="${esc(slotStr)}"
        placeholder="12:00, 12:30, 13:00"></div>
    <p class="hint">اتركها فارغة إذا كنت لا تريد تحديد أوقات. العميل سيتواصل معك بدل اختيار وقت.</p>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">واتساب المنشأة</h3>
    <div class="field"><label class="label">رقم الواتساب</label>
      <input class="input" id="f_wa" inputmode="tel" placeholder="05xxxxxxxx"
        value="${esc(r?.whatsapp ? '0' + r.whatsapp.slice(3) : '')}">
      <p class="hint" id="f_wa_hint">يُرسل العميل عليه فاتورة طلبه: كود الهدية + الخصم + الإجمالي.
        احذف الرقم إذا لم ترغب في استقبال الفواتير.</p></div>
    <label class="check"><input type="checkbox" id="f_wa_on"
      ${r?.whatsapp_orders_enabled ? 'checked' : ''}> استقبال فاتورة الطلب عبر واتساب</label>
    <p class="hint">القناة بلا رسوم: الطلب يُنشأ في المنصة أولاً، والواتساب يوصّل الفاتورة فقط.</p>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">نقاط الولاء</h3>
    <label class="check"><input type="checkbox" id="f_points"
      ${r?.points_enabled ? 'checked' : ''}> منح نقاط على الطلبات المكتملة</label>
    <div class="row2 mt">
      <div class="field"><label class="label">نقاط لكل طلب</label>
        <input class="input" id="f_ppoints" inputmode="numeric"
          value="${Number(r?.points_per_order || 0)}"></div>
      <div class="field"><label class="label">الحد الأعلى لكل طلب</label>
        <input class="input" id="f_pmax" inputmode="numeric"
          value="${Number(r?.points_max_per_order || 0)}"></div>
    </div>
    <p class="hint">تُمنح النقاط مرة واحدة لكل طلب بعد مسح باركوده، ولا تدخل رصيد العميل
      إلا عند اكتماله — والطلب الملغي لا نقاط له. الحد الأعلى من الإدارة: ${pointsCap} نقطة.
      النقاط استحقاق وعرض فقط في هذه المرحلة: لا استبدال ولا خصم ولا رصيد مالي.</p>
  </div>

  <button class="btn btn-primary btn-block btn-lg mt" id="save">حفظ التغييرات</button>

  <div class="card mt">
    <button class="btn btn-ghost btn-block" id="logout">تسجيل الخروج</button>
  </div>`;

/* معاينة رقم الواتساب — التطبيع النهائي على السيرفر */
$('#f_wa').addEventListener('input', () => {
  const raw = $('#f_wa').value.trim();
  const hint = $('#f_wa_hint');
  if (!raw) {
    hint.style.color = '';
    hint.textContent = 'لا يوجد رقم — لن يستقبل العميل الفاتورة عبر واتساب.';
    return;
  }
  const norm = localNormalizeWhatsapp(raw);
  hint.style.color = norm ? '' : '#c0392b';
  hint.textContent = norm ? 'سيُحفظ الرقم: ' + whatsappDisplay(raw)
    : 'رقم غير صحيح — أدخله بصيغة 05xxxxxxxx أو 9665xxxxxxxx';
});

$('#save').onclick = async () => {
  const waRaw = $('#f_wa').value.trim();
  if (waRaw && !localNormalizeWhatsapp(waRaw))
    return toast('رقم الواتساب غير صحيح — أدخله بصيغة 05xxxxxxxx');

  const { error } = await sb.from('restaurants').update({
    business_type: $('#f_biz').value,
    name: $('#f_name').value.trim(),
    phone: $('#f_phone').value.trim(),
    address: $('#f_addr').value.trim(),
    area_id: $('#f_area').value ? Number($('#f_area').value) : null,
    description: $('#f_desc').value.trim() || null,
    logo_url: $('#f_logo').value.trim() || null,
    cover_url: $('#f_cover').value.trim() || null,
    prep_time_min: Number($('#f_prep').value) || 20,
    pickup_enabled: $('#f_pickup').checked,
    delivery_enabled: $('#f_delivery').checked,
    min_order_total: Number($('#f_min').value) || 0
  }).eq('id', rid);
  if (error) return toast('تعذّر حفظ الملف');

  /* الرقم يُطبَّع على السيرفر (normalize_whatsapp) ولا يُخزَّن كما كُتب */
  const { data: wa } = await sb.rpc('set_restaurant_whatsapp', {
    p_whatsapp: waRaw || null, p_enabled: $('#f_wa_on').checked
  });
  if (!wa?.ok) return toast(wa?.error === 'invalid_whatsapp'
    ? 'رقم الواتساب غير صحيح — أدخله بصيغة 05xxxxxxxx'
    : 'تعذّر حفظ رقم الواتساب');
  if (wa.whatsapp) $('#f_wa').value = '0' + wa.whatsapp.slice(3);

  const list = $('#f_slots').value.split(',').map(s => s.trim()).filter(Boolean);
  await sb.rpc('set_pickup_slots', { p_slots: list });

  /* رسوم التوصيل: التحقق النهائي على السيرفر (الحد الأعلى + الصيغة) */
  const feeRaw = $('#f_dfee').value.trim();
  const { data: fee } = await sb.rpc('set_restaurant_delivery_fee', {
    p_fee: feeRaw === '' ? 0 : Number(feeRaw)
  });
  if (!fee?.ok) return toast(fee?.error === 'delivery_fee_cap'
    ? `الحد الأعلى لرسوم التوصيل ${sar(Number(fee.cap))} — اخفض المبلغ`
    : fee?.error === 'delivery_fee_invalid'
      ? 'أدخل رسوم التوصيل رقماً صحيحاً (منزلتان عشريتان على الأكثر)'
      : 'تعذّر حفظ رسوم التوصيل');
  $('#f_dfee').value = Number(fee.delivery_fee);

  /* النقاط: التحقق النهائي على السيرفر (السقف الأعلى + الصيغة) */
  const { data: pts } = await sb.rpc('set_restaurant_points', {
    p_enabled: $('#f_points').checked,
    p_per_order: Number($('#f_ppoints').value) || 0,
    p_max: Number($('#f_pmax').value) || 0
  });
  if (!pts?.ok) return toast(pts?.error === 'points_limit'
    ? `الحد الأعلى للنقاط ${pts.max} — اخفض القيمة`
    : pts?.error === 'points_invalid'
      ? 'أدخل عدداً صحيحاً غير سالب للنقاط'
      : 'تعذّر حفظ إعدادات النقاط');
  $('#f_ppoints').value = Number(pts.points_per_order);
  $('#f_pmax').value = Number(pts.points_max_per_order);

  toast('✅ تم الحفظ');
};

/* الرسوم تُحرَّر فقط عند تفعيل التوصيل */
$('#f_delivery').addEventListener('change', () => {
  $('#f_dfee').disabled = !$('#f_delivery').checked;
});

$('#logout').onclick = async () => { await sb.auth.signOut(); location.href = '../login.html'; };
</script>
</body>
</html>
