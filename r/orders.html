<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطلبات | لوحة المنشأة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="./"><span class="brand-mark"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg></span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">الطلبات</span></span></a>
  <span class="nav-spacer"></span>
  <button class="btn btn-ghost btn-sm" id="refresh">تحديث</button>
</div></header>
<div id="tabs"></div>
<main class="container" id="app" style="padding-bottom:40px"></main>
<script src="../assets/js/runtime-config-live.js"></script>
<script src="../assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, sar, dt, STATUS_AR, STATUS_CLASS } from '../assets/js/core.js';
import { $, esc, toast, modal, requireConfig, guardStaff } from '../assets/js/ui.js';
import { openWhatsApp } from '../assets/js/whatsapp.js';

if (!requireConfig()) throw new Error('not configured');
const auth = await guardStaff({ allowAdmin: false });
if (!auth) throw new Error('unauthorized');

$('#tabs').innerHTML = `<div class="container"><div class="tabs">
  ${[['d','اللوحة','./'],['o','الطلبات','./orders.html'],['m','المنيو','./menu.html'],
     ['f','العروض','./offers.html'],['c','مسح الباركود','./scan.html'],
     ['s','كشف الحساب','./statement.html'],
     ['p','الملف','./profile.html']].map(([k,l,h]) =>
    `<a class="tab ${k==='o'?'active':''}" href="${h}">${l}</a>`).join('')}
</div></div>`;

let filter = new URLSearchParams(location.search).get('f') || 'new';
/* إعدادات النقاط: المنشأة تمنح النقاط بعد المسح — والمبلغ الافتراضي تحدده هي */
let rsettings = {};

const ERRORS = {
  phone_not_shared: 'العميل لم يوافق على مشاركة رقمه — لا يمكن إرسال الفاتورة له.',
  points_disabled: 'النقاط غير مُفعَّلة لهذه المنشأة — فعّلها من «ملف المنشأة».',
  points_invalid: 'مبلغ النقاط غير صحيح — أدخل عدداً أكبر من صفر.',
  points_limit: 'مبلغ النقاط يتجاوز الحد الأعلى المسموح.',
  points_already_granted: 'نقاط هذا الطلب مُنحت مسبقاً — لا تُكرَّر على الطلب نفسه.'
};

async function load() {
  const { data } = await sb.rpc('restaurant_orders', { p_status: filter });
  const orders = (data?.orders || []).filter(o =>
    filter === 'all' || o.status === filter);

  const { data: rrow } = await sb.from('restaurants')
    .select('points_enabled, points_per_order, points_max_per_order')
    .eq('id', auth.restaurantId).maybeSingle();
  rsettings = rrow || {};

  $('#app').innerHTML = `
    <div class="page-head"><h1 class="page-title">الطلبات</h1></div>
    <div class="tabs">
      ${[['new','جديدة'],['accepted','مقبولة'],['preparing','تجهيز'],['ready','جاهزة'],
         ['completed','مكتملة'],['all','الكل']].map(([k,l]) =>
        `<a class="tab ${filter===k?'active':''}" href="?f=${k}">${l}</a>`).join('')}
    </div>
    ${orders.length ? orders.map(o => card(o)).join('')
      : '<div class="empty"><div class="empty-ico"><svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z" fill="none" stroke="currentColor" stroke-width="2"/></svg></div><p>لا توجد طلبات.</p></div>'}`;

  $('#app').querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b));
  $('#app').querySelectorAll('[data-share]').forEach(b =>
    b.onclick = () => shareInvoice(b.dataset.share));
  $('#app').querySelectorAll('[data-points]').forEach(b =>
    b.onclick = () => grantPoints(b.dataset.points));
}

function card(o) {
  const next = {
    new:      [['accepted','قبول'], ['cancelled','رفض']],
    accepted: [['preparing','بدء التجهيز'], ['cancelled','إلغاء']],
    preparing:[['ready','جاهز'], ['cancelled','إلغاء']],
    ready:    [['completed','تم التسليم'], ['no_show','لم يحضر']],
    completed:[], cancelled:[], no_show:[]
  }[o.status] || [];
  // لا قبول قبل تأكيد العميل للسعر (يشمل رسوم التوصيل) — الرفض يبقى متاحاً
  const blocked = !!o.awaiting_price_confirmation && o.status === 'new';
  const actions = blocked ? next.filter(([s]) => s !== 'accepted') : next;

  return `<div class="card mb">
    <div class="between">
      <div>
        <div class="order-code">#${esc(o.code)} · ${dt(o.created_at)}</div>
        <div style="font-weight:700;margin-top:2px">${esc(o.customer_name)}</div>
        ${o.phone_shared
          ? `<a class="small" href="tel:${esc(o.customer_phone)}"
              style="color:var(--orange-deep);text-decoration:none" dir="ltr">
              ${esc(o.customer_phone)}</a>`
          : `<span class="small muted" dir="ltr">${esc(o.phone_masked || '—')}
              · الرقم غير مُشارَك</span>`}
      </div>
      <div style="text-align:left">
        <span class="badge ${STATUS_CLASS[o.status]}">${STATUS_AR[o.status]}</span>
        <div style="font-weight:700;font-size:17px;margin-top:6px">${sar(o.total)}</div>
      </div>
    </div>

    <div class="flex" style="gap:6px;margin-top:8px;flex-wrap:wrap">
      <span class="badge">${o.order_type === 'pickup' ? 'استلام' : 'توصيل المنشأة'}</span>
      ${o.delivery_fee > 0 ? `<span class="badge badge-blue">رسوم التوصيل ${sar(o.delivery_fee)}</span>` : ''}
      ${blocked ? '<span class="badge badge-orange">بانتظار تأكيد العميل للسعر</span>' : ''}
      ${o.pickup_slot ? `<span class="badge" dir="ltr">${esc(o.pickup_slot)}</span>` : ''}
      ${o.has_discount ? `<span class="badge badge-orange">خصم هدية ${sar(o.discount)}</span>` : ''}
      ${o.gift_code ? `<span class="badge badge-orange">كود الهدية <b dir="ltr">${esc(o.gift_code)}</b></span>` : ''}
      ${o.whatsapp_shared_at ? '<span class="badge badge-blue">وصلت الفاتورة عبر واتساب</span>' : ''}
      ${o.phone_shared ? '' : '<span class="badge">الرقم مخفي بطلب العميل</span>'}
      ${o.points ? `<span class="badge badge-green">نقاط ${o.points}${
        o.points_status === 'pending' ? ' (تُعتمد عند الاكتمال)' : ''}</span>` : ''}
    </div>

    ${o.address ? `<p class="small muted mt">${esc(o.address)}</p>` : ''}
    ${o.note ? `<p class="small muted">${esc(o.note)}</p>` : ''}

    <div class="mt" style="border-top:1px solid var(--line);padding-top:10px">
      ${o.items.map(i => `<div class="between small" style="padding:3px 0">
        <span>${esc(i.name)} × ${i.qty}</span><span>${sar(i.line_total)}</span></div>`).join('')}
      ${o.discount > 0 ? `<div class="between small" style="color:var(--orange-deep)">
        <span>خصم تحمّله المنشأة</span><span>− ${sar(o.discount)}</span></div>` : ''}
      ${o.delivery_fee > 0 ? `<div class="between small muted">
        <span>رسوم التوصيل (تُحصَّل لك)</span><span>+ ${sar(o.delivery_fee)}</span></div>` : ''}
    </div>

    ${blocked ? `<p class="hint">لا يمكن القبول قبل أن يؤكد العميل المبلغ ${sar(o.total)}.
      يمكنك الرفض إن لم يوافق العميل على رسوم التوصيل.</p>` : ''}

    ${actions.length ? `<div class="flex mt" style="gap:8px">
      ${actions.map(([s,l]) => `<button class="btn btn-sm grow ${s==='cancelled'||s==='no_show'
        ? 'btn-red' : s==='completed' ? 'btn-green' : 'btn-primary'}"
        data-act="${s}" data-id="${o.id}">${l}</button>`).join('')}
    </div>` : ''}

    <div class="flex mt" style="gap:8px">
      <button class="btn btn-ghost btn-sm grow" data-share="${o.id}">
        إرسال الفاتورة للعميل</button>
      ${rsettings.points_enabled && !o.points && !['cancelled','no_show'].includes(o.status)
        ? `<button class="btn btn-ghost btn-sm grow" data-points="${o.id}">
            منح ${rsettings.points_per_order || 0} نقطة</button>` : ''}
    </div>
  </div>`;
}

async function act(btn) {
  const to = btn.dataset.act, id = btn.dataset.id;
  const needNote = ['cancelled','no_show'].includes(to);
  if (needNote) {
    modal(`<h3 class="modal-title">سبب الإلغاء / عدم الحضور</h3>
      <textarea class="input" id="rsn" placeholder="مثال: لم يتصل العميل"></textarea>
      <button class="btn btn-primary btn-block mt" id="rsn-ok">تأكيد</button>`, {
      onOpen: (m, close) => m.querySelector('#rsn-ok').onclick = async () => {
        close();
        await go(id, to, m.querySelector('#rsn').value.trim());
      }
    });
    return;
  }
  await go(id, to, null);
}

async function go(id, to, note) {
  const { data, error } = await sb.rpc('transition_order',
    { p_order: id, p_to: to, p_note: note });
  if (error || !data?.ok) {
    if (data?.error === 'price_not_confirmed')
      return toast('بانتظار تأكيد العميل للمبلغ قبل قبول الطلب');
    return toast(data?.error === 'invalid_transition'
      ? 'لا يمكن الانتقال إلى هذه الحالة' : 'تعذّر تحديث الطلب');
  }
  toast(to === 'completed'
    ? `تم — رسوم المنصة على هذا الطلب: ${sar(data.platform_fee)}`
    : 'تم التحديث');
  await load();
}

/* الفاتورة تُبنى على السيرفر — نرسلها إلى واتساب العميل */
async function shareInvoice(id) {
  const { data } = await sb.rpc('staff_order_share', { p_order: id });
  if (!data?.ok) return toast(data?.error === 'forbidden'
    ? 'غير مسموح لهذا الحساب' : ERRORS[data?.error] || 'تعذّر تجهيز الفاتورة');
  if (!data.whatsapp_ready) return toast('رقم جوال العميل غير صالح للإرسال');
  openWhatsApp(data.whatsapp, data.invoice);
}

/* النقاط: تُمنح مرة واحدة لكل طلب — والسيرفر يرفض أي تكرار */
async function grantPoints(id) {
  const { data, error } = await sb.rpc('staff_grant_points', { p_order: id, p_points: null });
  if (error || !data?.ok) return toast(ERRORS[data?.error] || 'تعذّر منح النقاط');
  toast(data.status === 'applied'
    ? `أُضيفت ${data.points} نقطة إلى رصيد العميل`
    : `${data.points} نقطة معلَّقة — تُعتمد عند اكتمال الطلب`);
  await load();
}

$('#refresh').onclick = load;
await load();
setInterval(load, 30000);
</script>
</body>
</html>
