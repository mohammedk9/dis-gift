<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العروض | لوحة المنشأة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="./"><span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">العروض</span></span></a>
  <span class="nav-spacer"></span>
  <button class="btn btn-primary btn-sm" id="addOffer">+ عرض جديد</button>
</div></header>
<div id="tabs"></div>
<main class="container" id="app" style="padding-bottom:40px"></main>
<script src="../assets/js/runtime-config-live.js"></script>
<script src="../assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, dt } from '../assets/js/core.js';
import { $, esc, toast, modal, requireConfig, guardStaff } from '../assets/js/ui.js';

if (!requireConfig()) throw new Error('not configured');
const auth = await guardStaff({ allowAdmin: false });
if (!auth) throw new Error('unauthorized');

$('#tabs').innerHTML = `<div class="container"><div class="tabs">
  ${[['d','اللوحة','./'],['o','الطلبات','./orders.html'],['m','المنيو','./menu.html'],
     ['f','العروض','./offers.html'],['s','كشف الحساب','./statement.html'],
     ['p','الملف','./profile.html']].map(([k,l,h]) =>
    `<a class="tab ${k==='f'?'active':''}" href="${h}">${l}</a>`).join('')}
</div></div>`;

const rid = auth.restaurantId;
const { data: offers } = await sb.from('offers')
  .select('*').eq('restaurant_id', rid).order('created_at', { ascending: false });

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">العروض والهدايا</h1>
    <p class="page-sub">أنت تحدد ما تقدّمه. العميل لا يرى القيمة قبل فتح الهدية.</p>
  </div>
  <div class="alert alert-info">
    الحد الأدنى العام للخصم <b>5%</b>. يمكنك اختيار «بدون خصم» وإضافة صنف مجاني فقط —
    القرار كامل لك.</div>
  ${(offers || []).length ? (offers || []).map(o => {
    const kindBadge = {
      percent: `<span class="badge badge-orange">خصم ${Number(o.min_value)}% — ${Number(o.max_value)}%</span>`,
      fixed_amount: `<span class="badge badge-orange">مبلغ ثابت ${Number(o.min_value)} — ${Number(o.max_value)} ر.س</span>`,
      free_item: `<span class="badge badge-green">🎁 ${esc(o.gift_label || 'صنف مجاني')}</span>`
    }[o.kind] || '';
    return `
    <div class="card mb">
      <div class="between">
        <div>
          <div style="font-weight:700">${esc(o.title)}</div>
          <div class="small muted">${esc(o.description || '')}</div>
        </div>
        <span class="badge ${o.is_enabled ? 'badge-green' : 'badge-red'}">
          ${o.is_enabled ? 'مفعّل' : 'موقوف'}</span>
      </div>
      <div class="flex mt" style="gap:6px;flex-wrap:wrap">
        ${kindBadge}
        <span class="badge">الحد اليومي ${o.daily_limit}</span>
        <span class="badge ${o.redeemed_on && o.redeemed_today >= o.daily_limit
          ? 'badge-red' : ''}">مستخدم اليوم ${o.redeemed_on ? o.redeemed_today : 0}</span>
      </div>
      ${o.active_until ? `<p class="small muted mt">ينتهي: ${dt(o.active_until)}</p>` : ''}
      <div class="flex mt" style="gap:8px">
        <button class="btn btn-ghost btn-sm grow" data-toggle="${o.id}"
          data-v="${o.is_enabled}">${o.is_enabled ? 'إيقاف' : 'تفعيل'}</button>
        <button class="btn btn-ghost btn-sm grow" data-edit="${o.id}">تعديل</button>
      </div>
    </div>`; }).join('')
  : '<div class="empty"><div class="empty-ico">🎁</div><p>لا توجد عروض.</p></div>'}`;
function edit(o) {
  const oo = o || { kind: 'percent', title: 'هدية', description: '', min_value: 5,
    max_value: 20, daily_limit: 20, gift_label: '', active_from: '', active_until: '' };
  modal(`<h3 class="modal-title">${o ? 'تعديل العرض' : 'عرض جديد'}</h3>

    <div class="field"><label class="label">نوع الهدية</label>
      <select class="input" id="o_kind">
        <option value="percent"      ${oo.kind === 'percent' ? 'selected' : ''}>خصم نسبة مئوية</option>
        <option value="fixed_amount" ${oo.kind === 'fixed_amount' ? 'selected' : ''}>مبلغ ثابت (ر.س)</option>
        <option value="free_item"    ${oo.kind === 'free_item' ? 'selected' : ''}>🎁 صنف مجاني (بدون خصم)</option>
      </select>
      <p class="hint">الخيار الثالث: هدية بدون خصم — تعطي صنفاً مجانياً فقط.</p>
    </div>

    <div class="field"><label class="label">عنوان العرض</label>
      <input class="input" id="o_title" value="${esc(oo.title)}"
        placeholder="مثال: هدية اليوم"></div>

    <div class="field"><label class="label">وصف مختصر</label>
      <input class="input" id="o_desc" value="${esc(oo.description || '')}"></div>

    <div id="box_range">
      <div class="row2">
        <div class="field"><label class="label" id="lbl_min">أدنى قيمة</label>
          <input class="input" id="o_min" inputmode="decimal" value="${Number(oo.min_value)}"></div>
        <div class="field"><label class="label" id="lbl_max">أعلى قيمة</label>
          <input class="input" id="o_max" inputmode="decimal" value="${Number(oo.max_value)}"></div>
      </div>
      <p class="hint" id="range_hint"></p>
    </div>

    <div id="box_free" class="hidden">
      <div class="field"><label class="label">الصنف المجاني</label>
        <select class="input" id="o_item">
          <option value="">— اختر صنفاً من قائمتك —</option>
        </select>
        <p class="hint">يجب إضافة الصنف في صفحة المنيو أولاً.</p>
      </div>
      <div class="field"><label class="label">النص الذي يراه العميل</label>
        <input class="input" id="o_label" value="${esc(oo.gift_label || '')}"
          placeholder="مثال: قهوة ساخنة مجاناً"></div>
    </div>

    <div class="field"><label class="label">الحد اليومي للاستخدام</label>
      <input class="input" id="o_lim" inputmode="numeric" value="${oo.daily_limit}"></div>
    <div class="row2">
      <div class="field"><label class="label">يبدأ من</label>
        <input class="input" id="o_from" type="datetime-local"
          value="${toLocal(oo.active_from)}"></div>
      <div class="field"><label class="label">ينتهي في</label>
        <input class="input" id="o_to" type="datetime-local"
          value="${toLocal(oo.active_until)}"></div>
    </div>
    <div class="field"><label class="label">ساعات التفعيل (اختياري)</label>
      <input class="input" id="o_hours"
        placeholder="مثال: 16:00-23:00 — اتركه فارغاً = طوال اليوم"
        value="${esc(hoursStr(oo.active_hours))}"></div>
    <button class="btn btn-primary btn-block mt" id="o_ok">حفظ العرض</button>`, {
    onOpen: async (m, close) => {
      // قائمة الأصناف لاختيار الصنف المجاني
      const { data: its } = await sb.from('menu_items')
        .select('id, name, price').eq('restaurant_id', rid)
        .eq('is_available', true).order('name');
      m.querySelector('#o_item').innerHTML = '<option value="">— اختر صنفاً —</option>' +
        (its || []).map(i => `<option value="${i.id}" ${oo.gift_item_id === i.id ? 'selected' : ''}
          >${esc(i.name)} — ${Number(i.price)} ر.س</option>`).join('');

      const kind = m.querySelector('#o_kind');
      const sync = () => {
        const k = kind.value;
        m.querySelector('#box_range').classList.toggle('hidden', k === 'free_item');
        m.querySelector('#box_free').classList.toggle('hidden', k !== 'free_item');
        m.querySelector('#lbl_min').textContent = k === 'percent' ? 'أدنى خصم %' : 'أدنى مبلغ ر.س';
        m.querySelector('#lbl_max').textContent = k === 'percent' ? 'أعلى خصم %' : 'أعلى مبلغ ر.س';
        m.querySelector('#range_hint').textContent = k === 'percent'
          ? 'النظام يختار قيمة داخل النطاق عند كل فتح. الحد الأدنى العام 5%.'
          : 'النظام يختار مبلغاً داخل النطاق. لا يتجاوز قيمة الطلب أبداً.';
      };
      kind.onchange = sync;
      sync();

      m.querySelector('#o_ok').onclick = async () => {
        const k = kind.value;
        const lim = Number(m.querySelector('#o_lim').value);
        if (!(lim > 0)) return toast('الحد اليومي يجب أن يكون أكبر من صفر');

        let min, max, itemId = null, label = null;
        if (k === 'free_item') {
          itemId = m.querySelector('#o_item').value || null;
          if (!itemId) return toast('اختر الصنف المجاني من قائمتك');
          label = m.querySelector('#o_label').value.trim() || null;
          min = 0; max = 0;
        } else {
          min = Number(m.querySelector('#o_min').value);
          max = Number(m.querySelector('#o_max').value);
          if (!(min >= 0)) return toast('أدخل قيمة صحيحة');
          if (!(max >= min)) return toast('القيمة الأعلى يجب أن تكون ≥ الأدنى');
          if (k === 'percent' && max > 100) return toast('نسبة الخصم لا تتجاوز 100%');
        }

        const row = {
          kind: k,
          title: m.querySelector('#o_title').value.trim() || 'هدية',
          description: m.querySelector('#o_desc').value.trim() || null,
          min_value: min, max_value: max,
          gift_item_id: itemId, gift_label: label,
          daily_limit: lim,
          active_from: m.querySelector('#o_from').value || null,
          active_until: m.querySelector('#o_to').value || null,
          active_hours: parseHours(m.querySelector('#o_hours').value)
        };

        const { error } = o
          ? await sb.from('offers').update(row).eq('id', o.id)
          : await sb.from('offers').insert({ ...row, restaurant_id: rid });
        if (error) return toast(error.message);
        close(); toast('تم الحفظ'); setTimeout(() => location.reload(), 400);
      };
    }
  });
}

function toLocal(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function hoursStr(h) {
  try {
    return (JSON.parse(h || '[]')).map(w => `${w.start}-${w.end}`).join(', ');
  } catch { return ''; }
}
function parseHours(s) {
  if (!s.trim()) return [];
  return s.split(',').map(p => {
    const [a, b] = p.trim().split('-');
    return { start: (a || '').trim(), end: (b || '').trim() };
  }).filter(w => w.start && w.end);
}

$('#app').querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
  await sb.from('offers').update({ is_enabled: b.dataset.v !== 'true' }).eq('id', b.dataset.toggle);
  toast('تم التحديث'); setTimeout(() => location.reload(), 300);
});
$('#app').querySelectorAll('[data-edit]').forEach(b => b.onclick = () =>
  edit((offers || []).find(o => o.id === b.dataset.edit)));

$('#addOffer').onclick = () => edit(null);
</script>
</body>
</html>
