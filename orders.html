<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلباتي | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<meta name="theme-color" content="#e86a33">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  /* ===== الهوية البرتقالية (متوافقة مع بقية الصفحات) ===== */
  :root{
    --orange:#e86a33; --orange-deep:#d9531a; --orange-text:#b94110; --orange-light:#f7a05f;
    --peach:#fdeee3; --peach-2:#fbe0cd; --cream:#fff8f1;
    --grad:linear-gradient(135deg,#f7a05f 0%,#ee6f33 48%,#d9531a 100%);
    --shadow-or:0 18px 38px -16px rgba(226,85,31,.55);
    --card-shadow:0 1px 2px rgba(26,19,14,.04),0 12px 32px -18px rgba(26,19,14,.16);
  }
  [hidden]{display:none !important}
  body{font-family:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
       background:linear-gradient(180deg,var(--cream) 0,#fff 360px) no-repeat,#fff}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid #f3e9dd}
  header.nav::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--orange-light),var(--orange),var(--orange-light),transparent);opacity:.55}
  header.nav .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow-or);font-size:0;flex:none}
  .brand-text{display:flex;flex-direction:column}
  .brand-name{font-size:20px;font-weight:700;line-height:1.1}
  .brand-sub{font-size:12px;color:#867b71;line-height:1.4}

  /* رأس الصفحة */
  .o-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 18px}
  .o-head .page-title{margin:0;font-weight:700}
  .o-count{background:var(--peach);color:var(--orange-text);border:1px solid var(--peach-2);
    font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;white-space:nowrap}

  /* بطاقة الطلب */
  a.order{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:#fff;
    border:1px solid #f1e7da;border-radius:22px;padding:16px;margin-bottom:12px;
    box-shadow:var(--card-shadow);transition:.2s}
  a.order:hover{transform:translateY(-2px);border-color:var(--peach-2);box-shadow:0 20px 36px -22px rgba(226,85,31,.5)}
  .order-ico{width:46px;height:46px;border-radius:15px;background:var(--peach);color:var(--orange-deep);
    display:grid;place-items:center;flex:none;border:1px solid var(--peach-2)}
  a.order .grow{flex:1;min-width:0}
  a.order .order-code{font-size:12.5px;color:#867b71}
  .order-shop{font-weight:600;font-size:15.5px;margin-top:2px;line-height:1.5}
  .order-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .order-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
  a.order .order-total{color:var(--orange-text);font-weight:700;font-size:16.5px;white-space:nowrap}
  .order-go{color:#c8b9a8;transition:.2s}
  a.order:hover .order-go{color:var(--orange);transform:translateX(-3px)}

  /* حالة فارغة */
  .state-card{margin-top:14px;border-radius:26px;border:1px solid #f1e7da;background:#fff;padding:38px 22px;
    text-align:center;box-shadow:var(--card-shadow)}
  .state-ico{width:72px;height:72px;margin:0 auto 12px;border-radius:24px;background:var(--peach);
    color:var(--orange-deep);display:grid;place-items:center;border:1px solid var(--peach-2)}
  .state-card h2{margin:6px 0 0;font-size:18px;font-weight:700}
  .state-cta{margin-top:20px;display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    background:var(--grad);color:#fff;border-radius:15px;padding:14px 28px;font-weight:700;font-size:15.5px;
    box-shadow:var(--shadow-or);transition:.2s}
  .state-cta:hover{transform:translateY(-2px)}

  a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:10px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="gift.html">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
      </svg>
    </span>
    <span class="brand-text"><span class="brand-name">هدية</span><span class="brand-sub">طلباتي</span></span>
  </a>
</div></header>
<main class="container page" id="app"></main>
<div id="nav"></div>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, sar, dt, STATUS_AR, STATUS_CLASS } from './assets/js/core.js';
import { $, esc, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

$('#nav').innerHTML = customerNav('orders');
if (!requireConfig()) throw new Error('not configured');

/* أيقونات SVG بدل الإيموجي */
const svg = (inner, s = 22, sw = 1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  bag:   (s, sw) => svg(`<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>`, s, sw),
  list:  (s, sw) => svg(`<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>`, s, sw),
  gift:  (s, sw) => svg(`<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>`, s, sw),
  chev:  (s, sw) => svg(`<path d="m15 18-6-6 6-6"/>`, s, sw)
};

const { data } = await sb.rpc('customer_orders', { p_device: deviceId() });
/* الشكل الجديد كائن: قائمة الطلبات + رصيد النقاط المعتمد */
const orders = data?.orders || [];
const pointsBalance = Number(data?.points_balance || 0);

$('#app').innerHTML = `
  <div class="o-head">
    <h1 class="page-title">طلباتي</h1>
    <span class="o-count">${orders.length} طلب</span>
  </div>
  ${pointsBalance > 0 ? `<div class="card mb" style="border-radius:20px">
    <div class="between small"><span>رصيد النقاط المعتمد</span>
      <b style="color:var(--orange-text);font-size:17px">${pointsBalance} نقطة</b></div>
    <p class="hint" style="margin:6px 0 0">النقاط استحقاق وعرض فقط في هذه المرحلة —
      لا استبدال ولا خصم بعد.</p>
  </div>` : ''}
  ${orders.length ? orders.map(o => `
    <a class="order" href="order.html?code=${esc(o.code)}">
      <span class="order-ico">${ICON.bag(22)}</span>
      <div class="grow">
        <div class="order-code">#${esc(o.code)} · ${dt(o.created_at)}</div>
        <div class="order-shop">${esc(o.restaurant)}</div>
        <div class="order-badges">
          <span class="badge ${STATUS_CLASS[o.status] || ''}">${STATUS_AR[o.status]}</span>
          <span class="badge">${o.order_type === 'pickup' ? 'استلام' : 'توصيل'}</span>
          ${o.points ? `<span class="badge badge-green">+${o.points} نقطة</span>` : ''}
        </div>
      </div>
      <div class="order-side">
        <div class="order-total">${sar(o.total)}</div>
        <span class="order-go">${ICON.chev(20, 2)}</span>
      </div>
    </a>`).join('')
  : `<div class="state-card">
      <div class="state-ico">${ICON.list(34, 1.6)}</div>
      <h2>لا توجد طلبات بعد</h2>
      <a class="state-cta" href="gift.html">${ICON.gift(19, 2)} افتح هديتك</a>
    </div>`}`;
initPWA();
</script>
</body>
</html>
