<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلباتي | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="gift.html">
    <span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">طلباتي</span></span>
  </a>
</div></header>
<main class="container page" id="app"></main>
<div id="nav"></div>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, sar, dt, STATUS_AR, STATUS_CLASS } from './assets/js/core.js';
import { $, esc, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

$('#nav').innerHTML = customerNav('orders');
if (!requireConfig()) throw new Error('not configured');

const { data } = await sb.rpc('customer_orders', { p_device: deviceId() });
const orders = data || [];

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">طلباتي</h1>
    <p class="page-sub">${orders.length} طلب</p>
  </div>
  ${orders.length ? orders.map(o => `
    <a class="order" href="order.html?code=${esc(o.code)}">
      <div class="grow">
        <div class="order-code">#${esc(o.code)} · ${dt(o.created_at)}</div>
        <div style="font-weight:600;margin-top:2px">${esc(o.restaurant)}</div>
        <div class="flex" style="gap:6px;margin-top:6px">
          <span class="badge ${STATUS_CLASS[o.status] || ''}">${STATUS_AR[o.status]}</span>
          <span class="badge">${o.order_type === 'pickup' ? 'استلام' : 'توصيل'}</span>
        </div>
      </div>
      <div class="order-total">${sar(o.total)}</div>
    </a>`).join('')
  : `<div class="empty"><div class="empty-ico">📋</div>
     <p>لا توجد طلبات بعد.</p>
     <a class="btn btn-primary mt" href="gift.html">🎁 افتح هديتك</a></div>`}`;
</script>
</body>
</html>

initPWA();
</script>
</body>
</html>
