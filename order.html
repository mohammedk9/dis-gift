<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حالة الطلب | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<meta name="theme-color" content="#e86a33">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  /* ===== الهوية البرتقالية (متوافقة مع بقية الصفحات) ===== */
  :root{
    --orange:#e86a33; --orange-deep:#d9531a; --orange-text:#b94110; --orange-light:#f7a05f;
    --peach:#fdeee3; --peach-2:#fbe0cd; --cream:#fff8f1;
    --grad:linear-gradient(135deg,#f7a05f 0%,#ee6f33 48%,#d9531a 100%);
    --shadow-or:0 18px 38px -16px rgba(226,85,31,.55);
    --card-shadow:0 1px 2px rgba(26,19,14,.04),0 12px 32px -18px rgba(26,19,14,.16);
  }
  [hidden]{display:none !important}
  .barcode-box{background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:12px 10px 6px;margin:4px 0 8px}
  .barcode-box svg{display:block;margin:0 auto}
  .ad-img{width:100%;border-radius:14px;margin:6px 0;display:block}
  body{font-family:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
       background:linear-gradient(180deg,var(--cream) 0,#fff 360px) no-repeat,#fff}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid #f3e9dd}
  header.nav::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--orange-light),var(--orange),var(--orange-light),transparent);opacity:.55}
  header.nav .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow-or);font-size:0;flex:none}
  .brand-text{display:flex;flex-direction:column}
  .brand-name{font-size:20px;font-weight:700;line-height:1.1}
  .brand-sub{font-size:12px;color:#867b71;line-height:1.4}
  #stBadge{font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}

  .page-head .page-title{font-weight:700}
  .page-head .page-sub{color:#6f655c}

  /* البطاقات */
  .acc-card{margin-top:16px;border-radius:24px;border:1px solid #f1e7da;background:#fff;padding:20px;
    box-shadow:var(--card-shadow)}
  .acc-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:16.5px;font-weight:700}
  .acc-ico{width:34px;height:34px;border-radius:11px;background:var(--peach);color:var(--orange-deep);
    display:grid;place-items:center;flex:none;border:1px solid var(--peach-2)}
  .acc-card .between{padding:5px 0}

  /* متتبّع الحالة */
  #app .tl-item{position:relative;padding:0 0 18px;padding-inline-start:38px;min-height:34px}
  #app .tl-item:last-child{padding-bottom:0}
  #app .tl-item::before{content:"";inset:auto;position:absolute;inset-inline-start:0;top:2px;width:24px;height:24px;
    border-radius:50%;background:#fff;border:2px solid #e8dccd;box-sizing:border-box;transition:.2s}
  #app .tl-item::after{content:"";inset:auto;position:absolute;inset-inline-start:11px;top:28px;bottom:-2px;width:2px;
    border-radius:2px;background:#eadfd1;height:auto}
  #app .tl-item:last-child::after{display:none}
  #app .tl-item.done::before{background:var(--grad);border-color:transparent;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 12.5 4 4 8-9'/></svg>"),var(--grad);
    background-size:14px 14px,100% 100%;background-position:center;background-repeat:no-repeat}
  #app .tl-item.done:not(.now)::after{background:var(--orange-light)}
  #app .tl-item.now::before{box-shadow:0 0 0 5px rgba(232,106,51,.2)}
  #app .tl-t{font-weight:600;font-size:15px;line-height:1.7;color:#9a8f85}
  #app .tl-item.done .tl-t{color:var(--ink,#1a130e)}
  #app .tl-item.now .tl-t{color:var(--orange-text)}
  #app .tl-d{font-size:12.5px;color:#6f655c;line-height:1.7}
  #app .tl-item.now .tl-d{color:var(--orange-text);font-weight:600}

  .total-row{background:var(--cream);border:1px solid var(--peach-2);border-radius:14px;padding:12px 14px !important;
    color:var(--orange-text);font-size:16px}
  .pay-note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;
    background:var(--peach);border:1px solid var(--peach-2);color:var(--orange-text);font-size:13.5px;line-height:1.8}
  .pay-note svg{flex:none;margin-top:3px}
  .call-btn{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;padding:13px;
    border-radius:15px;background:var(--grad);color:#fff;text-decoration:none;font-weight:700;font-size:15px;
    box-shadow:var(--shadow-or);transition:.2s}
  .call-btn:hover{transform:translateY(-2px)}

  .state-card{margin-top:14px;border-radius:26px;border:1px solid #f1e7da;background:#fff;padding:34px 22px;
    text-align:center;box-shadow:var(--card-shadow)}
  .state-ico{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;background:var(--peach);
    color:var(--orange-deep);display:grid;place-items:center;border:1px solid var(--peach-2)}
  .state-card p{color:#6f655c;font-size:14.5px;margin:6px 0 0}
  .state-btn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:#fff;color:var(--orange-text);border:1px solid var(--peach-2);border-radius:14px;
    padding:12px 24px;font-size:14.5px;font-weight:600;transition:.2s}
  .state-btn:hover{background:var(--peach);border-color:var(--orange-light)}

  a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:10px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="orders.html">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
      </svg>
    </span>
    <span class="brand-text"><span class="brand-name">هدية</span><span class="brand-sub">حالة الطلب</span></span>
  </a>
  <span class="nav-spacer"></span>
  <span class="badge" id="stBadge">…</span>
</div></header>
<main class="container page" id="app"></main>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, actorId, sar, dt, STATUS_AR, STATUS_CLASS } from './assets/js/core.js';
import { $, esc, toast, requireConfig, customerNav, initPWA, guardCustomer } from './assets/js/ui.js';
import { openWhatsApp } from './assets/js/whatsapp.js';
import { code39Svg } from './assets/js/barcode.js';

document.body.insertAdjacentHTML('beforeend', customerNav('orders'));
if (!requireConfig()) throw new Error('not configured');
/* تفاصيل الطلب وكوده تخصّ صاحب الحساب */
if (!await guardCustomer()) throw new Error('redirecting');

/* أيقونات SVG بدل الإيموجي */
const svg = (inner, s = 20, sw = 1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  search: (s, sw) => svg(`<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>`, s, sw),
  list:   (s, sw) => svg(`<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>`, s, sw),
  clock:  (s, sw) => svg(`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`, s, sw),
  phone:  (s, sw) => svg(`<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>`, s, sw),
  cash:   (s, sw) => svg(`<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>`, s, sw),
  chat:   (s, sw) => svg(`<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.5-4.1A8.4 8.4 0 0 1 3.6 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>`, s, sw),
  star:   (s, sw) => svg(`<path d="m12 3 2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.5 6.8 19.2l1-5.9-4.3-4.1 5.9-.8z"/>`, s, sw),
  tag:    (s, sw) => svg(`<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8A2 2 0 0 1 4.8 2.8H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8z"/><path d="M7.5 7.5h.01"/>`, s, sw)
};

const code = new URLSearchParams(location.search).get('code');
const STEPS = [['new','تم الإرسال'], ['accepted','قبل المنشأة'], ['preparing','قيد التجهيز'],
               ['ready','جاهز'], ['completed','مكتمل']];

/* الرسوم والسعر كلها من السيرفر — لا نحسب شيئاً هنا */
const ORDER_ERRORS = {
  order_not_found: 'لم نعثر على هذا الطلب.',
  invalid_transition: 'لا يمكن تنفيذ هذا الإجراء في حالة الطلب الحالية.',
  invalid_delivery_change: 'لا يمكن تغيير طريقة الاستلام بعد أن تبدأ المنشأة التنفيذ.',
  address_required: 'أدخل عنوان التوصيل (الحي والشارع).',
  pickup_slot_required: 'المنشأة لم تحدد أوقات استلام — تواصل معها.',
  delivery_not_available: 'هذه المنشأة لا توفر توصيل.',
  pickup_not_available: 'هذه المنشأة لا توفر استلام.',
  restaurant_unavailable: 'المنشأة غير متاحة حالياً.',
  price_changed: 'تغيّر سعر الطلب — راجع المبلغ الجديد ثم أكّده.',
  // مشاركة الجوال: التوصيل يحتاج الرقم والموافقة، والاستلام لا يحتاجهما
  phone_required: 'أضف رقم جوالك أولاً — التوصيل يحتاجه ليصلك الطلب.',
  consent_required: 'وافق على مشاركة رقمك مع المنشأة — التوصيل يحتاج ذلك.',
  invalid_phone: 'رقم الجوال غير صحيح — أدخله بصيغة 05xxxxxxxx.',
  // النقاط: استحقاق وعرض فقط في هذه المرحلة
  points_disabled: 'المنشأة لم تُفعّل النقاط.',
  points_invalid: 'مبلغ النقاط غير صحيح — أدخل عدداً أكبر من صفر.',
  points_limit: 'مبلغ النقاط يتجاوز الحد الأعلى المسموح.',
  points_already_granted: 'نقاط هذا الطلب مُنحت مسبقاً — لا تُكرَّر على الطلب نفسه.',
  // لا يظهران للعميل: غيابهما هو السلوك المطلوب
  phone_not_shared: 'الرقم غير مُشارَك مع المنشأة.',
  no_marketing_consent: 'لا توجد موافقة تسويق فعّالة — لا رسالة تسويقية.',
  no_ad_available: 'لا يوجد إعلان معروض حالياً.',
  invalid_order_code: 'كود الطلب غير صحيح.'
};
let currentTotal = 0;
let slots = [];
let ad = null;

async function load() {
  if (!code) { location.replace('orders.html'); return; }
  const { data } = await sb.rpc('customer_order', { p_device: actorId(), p_code: code });
  if (!data?.ok) {
    $('#app').innerHTML = `<div class="state-card"><div class="state-ico">${ICON.search(32, 1.6)}</div>
      <p>لم نعثر على هذا الطلب.</p>
      <a class="state-btn" href="orders.html">طلباتي</a></div>`;
    return;
  }
  const o = data.order, r = data.restaurant;
  const idx = STEPS.findIndex(s => s[0] === o.status);
  const dead = ['cancelled','no_show'].includes(o.status);
  const shareReady = !dead && !!r.whatsapp_orders_enabled && !!r.whatsapp;
  currentTotal = Number(o.total);

  /* أوقات الاستلام المتاحة (لتغيير الطريقة قبل القبول) — من السيرفر */
  if (o.status === 'new' && !slots.length && r.id) {
    const { data: m } = await sb.rpc('restaurant_menu', { p_restaurant: r.id });
    slots = m?.slots || [];
  }

  /* الإعلان داخل المنصة رسالة تسويقية: لا يظهر بلا موافقة تسويق فعّالة.
     غيابه ليس خطأ — لا نعرض شيئاً ونكمل. */
  ad = null;
  if (r.id) {
    const { data: adRes } = await sb.rpc('customer_ad', {
      p_device: actorId(), p_restaurant: r.id
    });
    if (adRes?.ok) ad = adRes.ad;
    else if (adRes?.error === 'no_marketing_consent' || adRes?.error === 'no_ad_available') ad = null;
  }

  $('#stBadge').textContent = STATUS_AR[o.status];
  $('#stBadge').className = 'badge ' + (STATUS_CLASS[o.status] || '');

  $('#app').innerHTML = `
    <div class="page-head">
      <h1 class="page-title">طلب <span dir="ltr">#${esc(o.code)}</span></h1>
      <p class="page-sub">${dt(o.created_at)}</p>
    </div>

    ${dead ? `<div class="alert alert-error">هذا الطلب ${STATUS_AR[o.status]} — لا توجد رسوم منصة عليه.</div>`
      : `<div class="acc-card">
        ${STEPS.map((s, i) => `<div class="tl-item ${i <= idx ? 'done' : ''} ${i === idx ? 'now' : ''}">
          <div class="tl-t">${s[1]}</div>
          <div class="tl-d">${i === idx ? 'الحالة الآن' : ''}</div>
        </div>`).join('')}
      </div>`}

    <div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.tag(18)}</span> باركود الطلب</h3>
      <div class="barcode-box">${code39Svg(o.code)}</div>
      <p class="hint">أظهر هذا الباركود للمنشأة عند التسليم: يقرأ الموظف منه رقم الطلب،
        يراجع الهدية، ويؤكد التسليم. نفس الكود مطبوع بالأرقام تحت الأشرطة.</p>
    </div>

    <div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.phone(18)}</span> رقم الجوال ومشاركته</h3>
      <div class="between small muted"><span>رقمك المسجَّل</span>
        <span dir="ltr">${esc(o.customer_phone || '—')}</span></div>
      <div class="between small"><span>حالة المشاركة مع المنشأة</span>
        <span class="badge ${o.phone_shared ? 'badge-green' : 'badge-orange'}">
          ${o.phone_shared ? 'مشارَك' : 'مخفي'}</span></div>
      <p class="hint">${o.phone_shared
        ? 'ترى المنشأة رقمك لهذا الطلب فقط. يمكنك سحبه في أي وقت قبل أن تبدأ التنفيذ.'
        : 'رقمك مخفي عن المنشأة. المشاركة اختيارية للاستلام، ومطلوبة للتوصيل فقط.'}</p>
      ${o.status === 'new' ? `
      <div class="field mt"><label class="label">رقم الجوال</label>
        <input class="input" id="pphone" inputmode="tel"
          value="${esc(o.customer_phone || '')}" placeholder="05xxxxxxxx"></div>
      <label class="check"><input type="checkbox" id="pconsent"
        ${o.phone_shared ? 'checked' : ''}>
        <span>أوافق على مشاركة رقمي مع المنشأة <b>للتواصل بخصوص هذا الطلب فقط</b>.</span></label>
      <button class="btn btn-ghost btn-block mt" id="save-phone">حفظ حالة المشاركة</button>` : ''}
    </div>

    <div class="acc-card">
      <div class="between"><span>المنشأة</span><span style="font-weight:600">${esc(r.name)}</span></div>
      <div class="between small muted"><span>طريقة الاستلام</span>
        <span>${o.order_type === 'pickup' ? 'استلام من المنشأة' : 'توصيل المنشأة'}</span></div>
      ${o.pickup_slot ? `<div class="between small muted"><span>وقت الاستلام</span>
        <span dir="ltr">${esc(o.pickup_slot)}</span></div>` : ''}
      ${o.address ? `<div class="between small muted"><span>العنوان</span>
        <span>${esc(o.address)}</span></div>` : ''}
      ${r.phone ? `<a class="call-btn" href="tel:${esc(r.phone)}"
        >${ICON.phone(18, 2)} اتصال بالمنشأة</a>` : ''}
    </div>

    ${o.awaiting_price_confirmation && o.status === 'new' ? `<div class="acc-card"
      style="border-color:var(--orange-light);background:var(--cream)">
      <h3 class="acc-title"><span class="acc-ico">${ICON.cash(18)}</span> تأكيد السعر مطلوب</h3>
      <p class="hint">أُضيفت رسوم توصيل على طلبك من المنشأة. لا تقبل المنشأة الطلب قبل تأكيدك
        لهذا المبلغ — وقد تُلغى الرسوم إن اخترت الاستلام من المنشأة.</p>
      <div class="between small"><span>الإجمالي</span><span>${sar(o.subtotal)}</span></div>
      <div class="between small muted"><span>الخصم</span><span>− ${sar(o.discount)}</span></div>
      <div class="between small" style="color:var(--orange-deep)"><span>رسوم التوصيل</span>
        <span>+ ${sar(o.delivery_fee)}</span></div>
      <div class="between" style="font-weight:700"><span>المطلوب دفعه</span><span>${sar(o.total)}</span></div>
      <button class="btn btn-primary btn-block mt" id="confirm-price">
        أؤكد المبلغ ${sar(o.total)}</button>
    </div>` : ''}

    <div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.list(18)}</span> الأصناف</h3>
      ${o.items.map(i => `<div class="between small" style="padding:6px 0">
        <span>${esc(i.name)} × ${i.qty}</span><span>${sar(i.line_total)}</span></div>`).join('')}
      <div style="height:1px;background:var(--line);margin:10px 0"></div>
      <div class="between small muted"><span>الإجمالي</span><span>${sar(o.subtotal)}</span></div>
      <div class="between small" style="color:var(--orange-deep)">
        <span>الخصم</span><span>− ${sar(o.discount)}</span></div>
      ${o.delivery_fee > 0 ? `<div class="between small" style="color:var(--orange-deep)">
        <span>رسوم التوصيل</span><span>+ ${sar(o.delivery_fee)}</span></div>` : ''}
      ${o.gift_code ? `<div class="between small muted"><span>كود الهدية</span>
        <span dir="ltr">${esc(o.gift_code)}</span></div>` : ''}
      <div class="between total-row" style="font-weight:700;margin-top:8px">
        <span>المطلوب دفعه للمطعم</span><span>${sar(o.total)}</span></div>
      <div class="pay-note">${ICON.cash(19)}<span>${esc(o.payment_note)}</span></div>
      ${o.note ? `<p class="small muted">ملاحظتك: ${esc(o.note)}</p>` : ''}
    </div>

    ${(Number(data.points_balance) > 0 || o.points) ? `<div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.star(18)}</span> النقاط</h3>
      <div class="between small"><span>رصيدك المعتمد</span>
        <b>${Number(data.points_balance || 0)} نقطة</b></div>
      ${o.points ? `<div class="between small muted"><span>نقاط هذا الطلب</span>
        <b>${o.points}</b></div>` : ''}
      ${o.points_status === 'pending' ? `<p class="hint">نقاط هذا الطلب معلَّقة —
        تُعتمد عند اكتمال الطلب.</p>` : ''}
      <p class="hint">النقاط استحقاق وعرض فقط في هذه المرحلة — لا استبدال ولا خصم ولا رصيد مالي.</p>
    </div>` : ''}

    ${ad ? `<div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.tag(18)}</span> عرض من المنشأة</h3>
      ${ad.image_url ? `<img class="ad-img" src="${esc(ad.image_url)}" alt="">` : ''}
      <p class="small">${esc(ad.title || '')}</p>
      <p class="hint">يظهر هذا الإعلان لأنك وافقت على التسويق من هذه المنشأة — ويمكنك سحبه من «حسابي».</p>
    </div>` : ''}

    ${o.status === 'new' ? `<div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.list(18)}</span> تغيير طريقة الاستلام</h3>
      <div class="field"><label class="label">الطريقة</label>
        <select class="input" id="dtype">
          <option value="pickup" ${o.order_type === 'pickup' ? 'selected' : ''}>استلام من المنشأة</option>
          <option value="delivery" ${o.order_type === 'delivery' ? 'selected' : ''}
            ${r.delivery_enabled ? '' : 'disabled'}>توصيل من المنشأة</option>
        </select></div>
      <div class="field" id="daddrBox"><label class="label">عنوان التوصيل</label>
        <input class="input" id="daddr" value="${esc(o.address || '')}"
          placeholder="الحي، الشارع، أقرب معلم"></div>
      <div class="field" id="dslotBox"><label class="label">وقت الاستلام</label>
        <select class="input" id="dslot">
          ${slots.map(s => `<option value="${s}">${s}</option>`).join('')
            || `<option value="">${o.pickup_slot ? String(o.pickup_slot).slice(0, 5) : 'لا توجد أوقات محددة'}</option>`}
        </select></div>
      <p class="hint">تغيير الطريقة يُعيد حساب رسوم التوصيل (${sar(r.delivery_fee || 0)}) ويطلب
        تأكيدك للسعر من جديد. متاح فقط قبل أن تبدأ المنشأة التنفيذ.</p>
      <button class="btn btn-ghost btn-block mt" id="save-delivery">حفظ طريقة الاستلام</button>
    </div>` : ''}

    ${shareReady ? `<div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.chat(18)}</span> إرسال الفاتورة عبر واتساب</h3>
      <p class="hint">نص الفاتورة يأتي من المنصة — نفس الإجمالي والخصم وكود الهدية.</p>
      <button class="btn btn-primary btn-block mt" id="wa-send">أرسل الفاتورة إلى واتساب المنشأة</button>
      ${o.whatsapp_shared_at ? `<p class="hint">سبق إرسالها في ${dt(o.whatsapp_shared_at)} — يمكنك إعادة الإرسال.</p>` : ''}
    </div>` : ''}

    ${data.timeline.length ? `<div class="acc-card">
      <h3 class="acc-title"><span class="acc-ico">${ICON.clock(18)}</span> سجل الطلب</h3>
      <div class="timeline">
        ${data.timeline.map(t => `<div class="tl-item done">
          <div class="tl-t">${STATUS_AR[t.status] || t.status}</div>
          <div class="tl-d">${dt(t.at)}${t.note ? ' · ' + esc(t.note) : ''}</div>
        </div>`).join('')}
      </div></div>` : ''}`;

  $('#wa-send')?.addEventListener('click', sendInvoice);
  $('#confirm-price')?.addEventListener('click', confirmPrice);
  $('#save-delivery')?.addEventListener('click', changeDelivery);
  $('#save-phone')?.addEventListener('click', savePhone);
  $('#dtype')?.addEventListener('change', syncDelivery);
  syncDelivery();

  if (!dead && !['completed'].includes(o.status)) setTimeout(load, 12000);
}

/* إظهار الحقول المناسبة لطريقة الاستلام المختارة (عرض فقط) */
function syncDelivery() {
  if (!$('#dtype')) return;
  const pickup = $('#dtype').value === 'pickup';
  $('#daddrBox').style.display = pickup ? 'none' : 'block';
  $('#dslotBox').style.display = pickup ? 'block' : 'none';
}

/* تأكيد السعر: نرسل الرقم الذي رآه العميل — والسيرفر يرفض إن تغيّر */
async function confirmPrice() {
  const { data } = await sb.rpc('customer_confirm_order_price', {
    p_device: actorId(), p_code: code, p_expected_total: currentTotal
  });
  if (!data?.ok) {
    toast(ORDER_ERRORS[data?.error] || 'تعذّر تأكيد السعر');
    return load();
  }
  toast('تم تأكيد السعر — الطلب الآن عند المنشأة');
  await load();
}

/* تغيير طريقة الاستلام قبل قبول المنشأة — الرسوم تُعاد حوسبتها على السيرفر */
async function changeDelivery() {
  const { data } = await sb.rpc('set_order_delivery', {
    p_device: actorId(), p_code: code, p_type: $('#dtype').value,
    p_address: $('#daddr').value.trim() || null,
    p_slot: $('#dslot').value || null
  });
  if (!data?.ok) {
    if (data?.error === 'phone_required' || data?.error === 'consent_required') {
      // التوصيل يحتاج رقماً وموافقة مشاركة: نوجّه العميل لبطاقة المشاركة
      toast(ORDER_ERRORS[data.error] + ' عدّل المشاركة في بطاقة الجوال أعلاه.', 4200);
      $('#pphone')?.focus();
      return;
    }
    toast(ORDER_ERRORS[data?.error] || 'تعذّر تحديث طريقة الاستلام');
    return;
  }
  toast(data.awaiting_price_confirmation
    ? 'تم التحديث — أكّد السعر الجديد' : 'تم تحديث طريقة الاستلام');
  await load();
}

/* مشاركة/سحب الجوال: القرار يُسجَّل بنص غرضه ووقته على السيرفر */
async function savePhone() {
  const phone = $('#pphone').value.trim().replace(/[\s-]/g, '');
  const { data } = await sb.rpc('set_order_phone', {
    p_device: actorId(), p_code: code,
    p_phone: phone || null, p_consent: $('#pconsent').checked
  });
  if (!data?.ok) {
    toast(ORDER_ERRORS[data?.error] || 'تعذّر تحديث حالة المشاركة');
    return;
  }
  toast(data.phone_shared
    ? 'الرقم مشارَك مع المنشأة لهذا الطلب'
    : 'تم سحب مشاركة الرقم — المنشأة لا تراه الآن');
  await load();
}

/* الفاتورة تُبنى على السيرفر — هنا نبني رابط الإرسال فقط */
let invoiceCache = null;
async function sendInvoice() {
  if (!invoiceCache) {
    const { data } = await sb.rpc('customer_order_share', { p_device: actorId(), p_code: code });
    if (!data?.ok) return toast('تعذّر تجهيز الفاتورة');
    if (!data.whatsapp_ready) return toast('المنشأة لا تستقبل الفاتورة عبر واتساب');
    invoiceCache = data;
  }
  openWhatsApp(invoiceCache.whatsapp, invoiceCache.invoice);
}

await load();
initPWA();
</script>
</body>
</html>
