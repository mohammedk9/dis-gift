<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إتمام الطلب | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="menu.html">
    <span class="brand-mark"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg></span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">إتمام الطلب</span></span>
  </a>
  <span class="nav-spacer"></span>
</div></header>
<main class="container page" id="app"></main>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, actorId, areaId, setArea, getGift, getCart, cartTotal, clearCart, sar }
  from './assets/js/core.js';
import { $, esc, toast, modal, requireConfig, customerNav, initPWA, guardCustomer } from './assets/js/ui.js';
import { openWhatsApp } from './assets/js/whatsapp.js';

document.body.insertAdjacentHTML('beforeend', customerNav('gift'));
if (!requireConfig()) throw new Error('not configured');
/* الطلب مرتبط بالحساب: لا طلب ولا كود هدية بلا تسجيل دخول */
const session = await guardCustomer();
if (!session) throw new Error('redirecting');

const gift = getGift(), cart = getCart();
if (!gift || !cart.length) { location.replace('gift.html'); throw new Error('bad state'); }

const rid = gift.restaurant.id;
const { data: menu } = await sb.rpc('restaurant_menu', { p_restaurant: rid });
const R = menu.restaurant;
const { data: areaRows } = await sb.rpc('active_areas');
const areas = areaRows || [];
const val = k => localStorage.getItem(k) || '';

/* بيانات العميل من حسابه في Supabase؛ المتجر المحلي ذاكرة سريعة فقط */
const { data: myProfile } = await sb.from('profiles')
  .select('full_name, phone').eq('id', session.user.id).maybeSingle();
const profileName = (myProfile?.full_name || val('hg_name')).trim();
const profilePhone = (myProfile?.phone || val('hg_phone')).trim();

const sub = cartTotal();
// رسوم التوصيل تأتي من السيرفر (restaurant_menu) — ما يظهر هنا للمعاينة فقط،
// والرقم النهائي يبنيه create_order على السيرفر.
const DELIVERY_FEE = Number(R.delivery_fee || 0);
const otype = () => document.querySelector('input[name=otype]:checked')?.value;
const feeFor = () => (otype() === 'delivery' ? DELIVERY_FEE : 0);
// قيمة الهدية تُحسب بنفس منطق قاعدة البيانات
let disc;
if (gift.gift.kind === 'fixed_amount') disc = Math.min(Number(gift.gift.discount), sub);
else disc = Math.round(sub * gift.gift.discount) / 100;
const totalFor = () => Math.round((sub - disc + feeFor()) * 100) / 100;
const total = totalFor();

const GIFT_TEXT = {
  percent:      (v) => `خصم ${v}%`,
  fixed_amount: (v) => `هدية ${v} ر.س`,
  free_item:    ()   => gift.gift.gift_label || 'صنف مجاني'
};
const giftText = GIFT_TEXT[gift.gift.kind || 'percent'](gift.gift.discount);

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">إتمام الطلب</h1>
    <p class="page-sub">${esc(R.name)}</p>
  </div>

  <div class="alert alert-info">الدفع يتم مباشرة مع المنشأة — عند الاستلام أو عند توصيلها.
    لا يتم أي دفع إلكتروني عبر المنصة.</div>

  <div class="card">
    <h3 class="section-title" style="margin-top:0;font-size:15px">طريقة الاستلام</h3>
    <label class="check"><input type="radio" name="otype" value="pickup"
      ${R.pickup_enabled ? 'checked' : ''} ${R.pickup_enabled ? '' : 'disabled'}>
      <span><b>استلام من المنشأة</b><br><span class="small muted">اختر وقت الاستلام</span></span></label>
    <label class="check"><input type="radio" name="otype" value="delivery"
      ${!R.pickup_enabled && R.delivery_enabled ? 'checked' : ''}
      ${R.delivery_enabled ? '' : 'disabled'}>
      <span><b>توصيل من المنشأة</b><br>
      <span class="small muted">${R.delivery_enabled
        ? (DELIVERY_FEE > 0 ? `رسوم التوصيل ${sar(DELIVERY_FEE)} — تحددها المنشأة`
                            : 'توفره المنشأة بنفسها بلا رسوم توصيل')
        : 'غير متاح من هذه المنشأة حالياً'}</span></span></label>

    ${R.pickup_enabled ? `
    <div id="slotBox" class="field mt">
      <label class="label">وقت الاستلام</label>
      <select class="input" id="slot">
        ${(menu.slots || []).map(s => `<option value="${s}">${s}</option>`).join('')
          || '<option value="">لا توجد أوقات محددة</option>'}
      </select>
      <p class="hint">أوقات الاستلام يحددها المنشأة من جدول الوقت الخاص بها.</p>
    </div>` : ''}
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">بيانات التواصل</h3>
    <div class="field"><label class="label">الاسم</label>
      <input class="input" id="cname" value="${esc(profileName)}" placeholder="اسمك الكامل"></div>
    <div class="row2">
      <div class="field"><label class="label">رقم الجوال
        <span class="muted small" id="phoneReq">(اختياري)</span></label>
        <input class="input" id="cphone" value="${esc(profilePhone)}" inputmode="tel"
          placeholder="05xxxxxxxx"></div>
      <div class="field"><label class="label">الحي</label>
        <select class="input" id="carea">
          <option value="">— اختر —</option>
          ${areas.map(a => `<option value="${a.id}" ${areaId() === a.id ? 'selected' : ''}
            >${esc(a.name)}</option>`).join('')}
        </select></div>
    </div>
    <p class="hint" id="phoneHint">للاستلام من المنشأة لا نحتاج رقمك — اتركه فارغاً إن رغبت.</p>
    <div class="field" id="addrBox"><label class="label">العنوان (للتوصيل)</label>
      <input class="input" id="caddr" value="${esc(val('hg_addr'))}"
        placeholder="الحي، الشارع، أقرب معلم"></div>
    <div class="field"><label class="label">ملاحظة للمنشأة (اختياري)</label>
      <textarea class="input" id="cnote" placeholder="مثال: بدون بصل"></textarea></div>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">الموافقات</h3>
    <label class="check" id="c1Box"><input type="checkbox" id="c1">
      <span>أوافق على مشاركة رقم جوالي مع المنشأة <b>للتواصل بخصوص هذا الطلب فقط</b>.</span></label>
    <p class="hint" id="c1Hint">مطلوبة للتوصيل فقط — المندوب يحتاج رقمك ليصلك.</p>
    <label class="check"><input type="checkbox" id="c2">
      <span>(اختياري) أوافق على تلقي عروض وتسويق من المنشأة.</span></label>
    <p class="hint">يُسجَّل لكل موافقة: نص غرضها كما تراه الآن، ووقتها، ونسخة السياسة.
      موافقة التسويق ليست شرطاً لاستخدام الخدمة ولا لأي طلب، ولا تُعرض عليك أي رسالة
      تسويقية من منشأة بدونها. ويمكنك سحب أي موافقة من «حسابي» في أي وقت.
      <br><b>ملاحظة:</b> المتطلبات النظامية لحماية البيانات
      <span class="badge badge-orange">تحتاج تحققاً رسمياً</span></p>
  </div>

  <div class="card mt">
    <div class="between"><span>الإجمالي قبل الخصم</span><span>${sar(sub)}</span></div>
    <div class="between" style="color:var(--orange-deep)">
      <span>${esc(giftText)}</span>
      <span>− ${sar(disc)}</span></div>
    <div class="between" id="feeRow" style="color:var(--orange-deep);display:none">
      <span>رسوم التوصيل</span><span id="feeVal">+ ${sar(DELIVERY_FEE)}</span></div>
    ${gift.gift.kind === 'free_item' ? `<div class="alert alert-info mt">
      ${esc(gift.gift.gift_label || 'الصنف المجاني')} سيُضاف للطلب تلقائياً وسعره صفر.</div>` : ''}
    <div class="between" style="font-weight:700;font-size:18px;border-top:1px solid var(--line);
      padding-top:10px;margin-top:6px">
      <span>المطلوب دفعه</span><span id="sumTotal">${sar(total)}</span></div>
    ${gift.gift.code ? `<div class="between small muted" style="margin-top:6px">
      <span>كود هديتك</span><span dir="ltr">${esc(gift.gift.code)}</span></div>` : ''}
    ${R.points_enabled && Number(R.points_per_order) > 0 ? `<div class="alert alert-info mt">
      عند اكتمال هذا الطلب تمنحك ${esc(R.name)} ${Number(R.points_per_order)} نقطة،
      وتظهر في رصيدك بعد أن يؤكد الموظف التسليم بمسح باركود الطلب.</div>` : ''}
    <p class="hint">بعد إنشاء الطلب يمكنك إرسال الفاتورة إلى واتساب المنشأة — نفس الأرقام ونفس الكود.
      ${DELIVERY_FEE > 0 ? 'ورسوم التوصيل يضيفها السيرفر ويطلب تأكيدك لها.' : ''}</p>
    <button class="btn btn-primary btn-block btn-lg mt" id="submit">تأكيد الطلب</button>
    <p class="hint center">الدفع يتم مباشرة مع المنشأة. لا رسوم على المنصة إلا عند اكتمال الطلب.</p>
  </div>`;

function syncFields() {
  const isPickup = otype() === 'pickup';
  $('#addrBox').style.display = isPickup ? 'none' : 'block';
  if ($('#slotBox')) $('#slotBox').style.display = isPickup ? 'block' : 'none';
  // الجوال والموافقة على مشاركته: مطلوبان للتوصيل فقط، اختياريان للاستلام
  $('#phoneReq').textContent = isPickup ? '(اختياري)' : '(مطلوب للتوصيل)';
  $('#phoneHint').textContent = isPickup
    ? 'للاستلام من المنشأة لا نحتاج رقمك — اتركه فارغاً إن رغبت.'
    : 'المندوب يحتاج رقمك ليصلك الطلب — لن يُشارَك إلا مع هذه المنشأة ولهذا الطلب.';
  $('#c1Hint').textContent = isPickup
    ? 'اختيارية للاستلام — شاركه فقط إن أردت أن تتواصل معك المنشأة.'
    : 'مطلوبة للتوصيل فقط — المندوب يحتاج رقمك ليصلك.';
  // رسوم التوصيل تظهر فقط عند اختيار التوصيل (المعاينة؛ الحساب النهائي على السيرفر)
  const fee = feeFor();
  $('#feeRow').style.display = fee > 0 ? 'flex' : 'none';
  $('#feeVal').textContent = '+ ' + sar(fee);
  $('#sumTotal').textContent = sar(totalFor());
}
document.querySelectorAll('input[name=otype]').forEach(r => r.onchange = syncFields);
syncFields();

const ERRORS = {
  consent_required: 'الموافقة على مشاركة رقم الجوال مطلوبة للتوصيل.',
  phone_required: 'رقم الجوال مطلوب للتوصيل — المندوب يحتاجه ليصلك الطلب.',
  invalid_phone: 'رقم الجوال غير صحيح — أدخله بصيغة 05xxxxxxxx.',
  gift_already_used: 'تم استخدام هذه الهدية مسبقاً.',
  empty_cart: 'السلة فارغة.',
  below_min_order: 'الطلب أقل من الحد الأدنى للمطعم.',
  pickup_slot_required: 'اختر وقت الاستلام.',
  delivery_not_available: 'هذه المنشأة لا توفر توصيل.',
  pickup_not_available: 'هذه المنشأة لا توفر استلام.',
  restaurant_unavailable: 'المنشأة غير متاحة حالياً.',
  gift_not_found: 'الهدية غير موجودة.',
  address_required: 'أدخل عنوان التوصيل (الحي والشارع) — التوصيل يحتاج عنواناً.',
  price_not_confirmed: 'لم يُؤكَّد السعر بعد — المنشأة لا تقبل الطلب قبل التأكيد.',
  price_changed: 'تغيّر سعر الطلب — راجع التفاصيل وأعد التأكيد.',
  invalid_delivery_change: 'لا يمكن تغيير طريقة الاستلام بعد بدء التنفيذ.'
};

$('#submit').onclick = async () => {
  const name = $('#cname').value.trim();
  const phone = $('#cphone').value.trim().replace(/[\s-]/g, '');
  if (!name) return toast('أدخل الاسم');
  // الجوال اختياري للاستلام: إن كُتب فيجب أن يكون صحيحاً، وإن تُرك فارغاً فلا مشكلة
  if (phone && !/^05\d{8}$/.test(phone))
    return toast('أدخل رقم جوال صحيح يبدأ بـ 05 أو اتركه فارغاً');
  if (otype() === 'delivery' && !phone)
    return toast('رقم الجوال مطلوب للتوصيل — المندوب يحتاجه');
  if (otype() === 'delivery' && !$('#c1').checked)
    return toast('الموافقة على مشاركة الرقم مطلوبة للتوصيل');
  if (otype() === 'pickup' && !R.pickup_enabled) return toast('هذه المنشأة لا توفر استلام');
  if (otype() === 'delivery' && !R.delivery_enabled) return toast('هذه المنشأة لا توفر توصيل');
  if (otype() === 'delivery' && !$('#caddr').value.trim()) return toast('أدخل العنوان للتوصيل');

  const slotVal = $('#slot')?.value;
  if (otype() === 'pickup' && !slotVal) {
    return toast('المنشأة لم تحدد أوقات استلام — تواصل معه أو غداً');
  }

  localStorage.setItem('hg_name', name);    // ذاكرة سريعة محلية
  localStorage.setItem('hg_phone', phone);
  localStorage.setItem('hg_addr', $('#caddr').value.trim());
  setArea($('#carea').value);
  /* يُحدَّث الاسم والجوال في الحساب أيضاً — لا يبقى الحفظ في المتصفح وحده */
  if (name !== profileName || phone !== profilePhone) {
    sb.from('profiles').update({ full_name: name || null, phone: phone || null })
      .eq('id', session.user.id).then(() => {});
  }

  const btn = $('#submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ الإرسال…';

  const { data, error } = await sb.rpc('create_order', {
    p_device: actorId(),
    p_gift: gift.gift.id,
    p_type: otype(),
    p_items: cart.map(i => ({ item_id: i.id, qty: i.qty })),
    p_name: name,
    p_phone: phone || null,
    p_area: $('#carea').value ? Number($('#carea').value) : null,
    p_address: $('#caddr').value.trim() || null,
    p_slot: otype() === 'pickup' ? slotVal : null,
    p_note: $('#cnote').value.trim() || null,
    p_consent_order_contact: $('#c1').checked,
    p_consent_marketing: $('#c2').checked
  });

  if (error || !data?.ok) {
    btn.disabled = false;
    btn.textContent = 'تأكيد الطلب';
    return toast(ERRORS[data?.error] || 'تعذّر إنشاء الطلب');
  }

  clearCart();
  localStorage.setItem('hg_gift', JSON.stringify({
    ...gift, gift: { ...gift.gift, redeemed: true }
  }));

  /* رسوم التوصيل يضيفها السيرفر — والعميل يؤكد الرقم الذي رآه قبل أن تقبله المنشأة */
  if (data.awaiting_price_confirmation) {
    toast('أُنشئ الطلب — تأكيد السعر مطلوب');
    return priceConfirmStep(data);
  }

  toast('تم إرسال الطلب للمنشأة');
  await shareStep(data.code);
};

/* العميل يؤكد السعر الذي أضاف فيه السيرفر رسوم التوصيل */
function priceConfirmStep(created) {
  const orderUrl = `order.html?code=${encodeURIComponent(created.code)}`;
  modal(`
    <h3 class="modal-title">تأكيد السعر</h3>
    <p class="small muted">المنشأة تضيف رسوم توصيل على هذا الطلب. راجع المبلغ قبل التأكيد.</p>
    <div style="border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--cream)">
      <div class="between small"><span>الإجمالي</span><span>${sar(created.subtotal)}</span></div>
      <div class="between small muted"><span>الخصم</span><span>− ${sar(created.discount)}</span></div>
      <div class="between small" style="color:var(--orange-deep)"><span>رسوم التوصيل</span>
        <span>+ ${sar(created.delivery_fee)}</span></div>
      <div class="between" style="font-weight:700">
        <span>المطلوب دفعه</span><span>${sar(created.total)}</span></div>
    </div>
    <p class="hint">لا تقبل المنشأة الطلب قبل تأكيدك لهذا المبلغ. إن غيّرت طريقة الاستلام
      إلى الاستلام من المنشأة تُلغى رسوم التوصيل.</p>
    <button class="btn btn-primary btn-block btn-lg" id="price-ok">أؤكد هذا السعر</button>
    <button class="btn btn-ghost btn-block mt" id="price-later">أراجع الطلب أولاً</button>`, {
    onOpen: (m, close) => {
      m.querySelector('#price-ok').onclick = async () => {
        const { data } = await sb.rpc('customer_confirm_order_price', {
          p_device: actorId(), p_code: created.code, p_expected_total: Number(created.total)
        });
        close();
        if (!data?.ok) {
          toast(ERRORS[data?.error] || 'تعذّر تأكيد السعر');
          if (data?.error === 'price_changed') location.href = orderUrl;
          return;
        }
        toast('تم تأكيد السعر — الطلب الآن عند المنشأة');
        await shareStep(created.code);
      };
      m.querySelector('#price-later').onclick = () => { close(); location.href = orderUrl; };
    }
  });
}

/* الطلب أُنشئ أولاً بأرقام قاعدة البيانات، ثم نعرض قناة الإرسال */
async function shareStep(code) {
  const { data: share } = await sb.rpc('customer_order_share', {
    p_device: actorId(), p_code: code
  });
  const ready = !!share?.whatsapp_ready;
  const orderUrl = `order.html?code=${encodeURIComponent(code)}`;

  modal(`
    <h3 class="modal-title">تم إنشاء طلبك</h3>
    <p class="small muted">رقم الطلب <b dir="ltr">#${esc(code)}</b> — الطلب محفوظ عند المنشأة قبل أي إرسال.</p>
    <div style="border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--cream)">
      <div class="between small"><span>الإجمالي</span><span>${sar(share?.subtotal ?? sub)}</span></div>
      <div class="between small muted"><span>الخصم</span><span>− ${sar(share?.discount ?? disc)}</span></div>
      ${Number(share?.delivery_fee || 0) > 0 ? `<div class="between small" style="color:var(--orange-deep)">
        <span>رسوم التوصيل</span><span>+ ${sar(share.delivery_fee)}</span></div>` : ''}
      <div class="between" style="font-weight:700">
        <span>المطلوب دفعه</span><span>${sar(share?.total ?? total)}</span></div>
      ${share?.gift_code ? `<div class="between small muted"><span>كود الهدية</span>
        <span dir="ltr">${esc(share.gift_code)}</span></div>` : ''}
    </div>
    ${ready
      ? `<p class="hint">نص الفاتورة يأتي من المنصة — نفس الإجمالي والخصم وكود الهدية.</p>
         <button class="btn btn-primary btn-block btn-lg" id="wa-send">أرسل الفاتورة عبر واتساب</button>`
      : `<p class="hint">المنشأة لم تُضف رقم واتساب بعد — تابع طلبك داخل المنصة.</p>`}
    <button class="btn btn-ghost btn-block ${ready ? 'mt' : ''}" id="go-order">متابعة داخل المنصة</button>`, {
    onOpen: (m, close) => {
      m.querySelector('#wa-send')?.addEventListener('click', () => {
        openWhatsApp(share.whatsapp, share.invoice);
        close();
        location.href = orderUrl;
      });
      m.querySelector('#go-order').addEventListener('click', () => {
        close();
        location.href = orderUrl;
      });
    }
  });

  /* إغلاق النافذة (الضغط خارجها) ينقل لمتابعة الطلب بدل البقاء على سلة فارغة */
  const bg = document.querySelector('.modal-bg:last-child');
  bg?.addEventListener('click', e => { if (e.target === bg) location.href = orderUrl; });
}
initPWA();
</script>
</body>
</html>
