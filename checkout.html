<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إتمام الطلب | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="menu.html">
    <span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">إتمام الطلب</span></span>
  </a>
  <span class="nav-spacer"></span>
</div></header>
<main class="container page" id="app"></main>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, areaId, setArea, getGift, getCart, cartTotal, clearCart, sar }
  from './assets/js/core.js';
import { $, esc, toast, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

document.body.insertAdjacentHTML('beforeend', customerNav('gift'));
if (!requireConfig()) throw new Error('not configured');

const gift = getGift(), cart = getCart();
if (!gift || !cart.length) { location.replace('gift.html'); throw new Error('bad state'); }

const rid = gift.restaurant.id;
const { data: menu } = await sb.rpc('restaurant_menu', { p_restaurant: rid });
const R = menu.restaurant;
const { data: areaRows } = await sb.rpc('active_areas');
const areas = areaRows || [];
const val = k => localStorage.getItem(k) || '';

const sub = cartTotal();
// قيمة الهدية تُحسب بنفس منطق قاعدة البيانات
let disc;
if (gift.gift.kind === 'fixed_amount') disc = Math.min(Number(gift.gift.discount), sub);
else disc = Math.round(sub * gift.gift.discount) / 100;
const total = Math.round((sub - disc) * 100) / 100;

const GIFT_TEXT = {
  percent:      (v) => `خصم ${v}%`,
  fixed_amount: (v) => `هدية ${v} ر.س`,
  free_item:    ()   => gift.gift.gift_label || 'صنف مجاني'
};
const giftText = GIFT_TEXT[gift.gift.kind || 'percent'](gift.gift.discount);

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">إتمام الطلب</h1>
    <p class="page-sub">${esc(R.name)}</p>
  </div>

  <div class="alert alert-info">💵 الدفع يتم مباشرة مع المنشأة — عند الاستلام أو عند توصيلها.
    لا يتم أي دفع إلكتروني عبر المنصة.</div>

  <div class="card">
    <h3 class="section-title" style="margin-top:0;font-size:15px">1️⃣ طريقة الاستلام</h3>
    <label class="check"><input type="radio" name="otype" value="pickup"
      ${R.pickup_enabled ? 'checked' : ''} ${R.pickup_enabled ? '' : 'disabled'}>
      <span><b>استلام من المنشأة</b><br><span class="small muted">اختر وقت الاستلام</span></span></label>
    <label class="check"><input type="radio" name="otype" value="delivery"
      ${!R.pickup_enabled && R.delivery_enabled ? 'checked' : ''}
      ${R.delivery_enabled ? '' : 'disabled'}>
      <span><b>توصيل من المنشأة</b><br>
      <span class="small muted">${R.delivery_enabled ? 'توفره المنشأة بنفسها'
        : 'غير متاح من هذه المنشأة حالياً'}</span></span></label>

    ${R.pickup_enabled ? `
    <div id="slotBox" class="field mt">
      <label class="label">وقت الاستلام</label>
      <select class="input" id="slot">
        ${(menu.slots || []).map(s => `<option value="${s}">${s}</option>`).join('')
          || '<option value="">لا توجد أوقات محددة</option>'}
      </select>
      <p class="hint">أوقات الاستلام يحددها المنشأة من جدول الوقت الخاص بها.</p>
    </div>` : ''}
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">2️⃣ بيانات التواصل</h3>
    <div class="field"><label class="label">الاسم</label>
      <input class="input" id="cname" value="${esc(val('hg_name'))}" placeholder="اسمك الكامل"></div>
    <div class="row2">
      <div class="field"><label class="label">رقم الجوال</label>
        <input class="input" id="cphone" value="${esc(val('hg_phone'))}" inputmode="tel"
          placeholder="05xxxxxxxx"></div>
      <div class="field"><label class="label">الحي</label>
        <select class="input" id="carea">
          <option value="">— اختر —</option>
          ${areas.map(a => `<option value="${a.id}" ${areaId() === a.id ? 'selected' : ''}
            >${esc(a.name)}</option>`).join('')}
        </select></div>
    </div>
    <div class="field" id="addrBox"><label class="label">العنوان (للتوصيل)</label>
      <input class="input" id="caddr" value="${esc(val('hg_addr'))}"
        placeholder="الحي، الشارع، أقرب معلم"></div>
    <div class="field"><label class="label">ملاحظة للمنشأة (اختياري)</label>
      <textarea class="input" id="cnote" placeholder="مثال: بدون بصل"></textarea></div>
  </div>

  <div class="card mt">
    <h3 class="section-title" style="margin-top:0;font-size:15px">3️⃣ الموافقات</h3>
    <label class="check"><input type="checkbox" id="c1">
      <span>أوافق على مشاركة رقم جوالي مع المنشأة للتواصل بخصوص هذا الطلب.</span></label>
    <label class="check"><input type="checkbox" id="c2">
      <span>(اختياري) أوافق على تلقي عروض وتسويق من المنشأة.</span></label>
    <p class="hint">موافقة التسويق ليست شرطاً لاستخدام الخدمة. يُسجَّل نوع الموافقة ووقتها.
      <br><b>ملاحظة:</b> المتطلبات النظامية لحماية البيانات
      <span class="badge badge-orange">تحتاج تحققاً رسمياً</span></p>
  </div>

  <div class="card mt">
    <div class="between"><span>الإجمالي قبل الخصم</span><span>${sar(sub)}</span></div>
    <div class="between" style="color:var(--orange-deep)">
      <span>${esc(giftText)}</span>
      <span>− ${sar(disc)}</span></div>
    ${gift.gift.kind === 'free_item' ? `<div class="alert alert-info mt">
      🎁 ${esc(gift.gift.gift_label || 'الصنف المجاني')} سيُضاف للطلب تلقائياً وسعره صفر.</div>` : ''}
    <div class="between" style="font-weight:700;font-size:18px;border-top:1px solid var(--line);
      padding-top:10px;margin-top:6px">
      <span>المطلوب دفعه</span><span>${sar(total)}</span></div>
    <button class="btn btn-primary btn-block btn-lg mt" id="submit">تأكيد الطلب</button>
    <p class="hint center">الدفع يتم مباشرة مع المنشأة. لا رسوم على المنصة إلا عند اكتمال الطلب.</p>
  </div>`;

const otype = () => document.querySelector('input[name=otype]:checked')?.value;
function syncFields() {
  const isPickup = otype() === 'pickup';
  $('#addrBox').style.display = isPickup ? 'none' : 'block';
  if ($('#slotBox')) $('#slotBox').style.display = isPickup ? 'block' : 'none';
}
document.querySelectorAll('input[name=otype]').forEach(r => r.onchange = syncFields);
syncFields();

const ERRORS = {
  consent_required: 'يجب الموافقة على مشاركة رقم الجوال للمطعم.',
  gift_already_used: 'تم استخدام هذه الهدية مسبقاً.',
  empty_cart: 'السلة فارغة.',
  below_min_order: 'الطلب أقل من الحد الأدنى للمطعم.',
  pickup_slot_required: 'اختر وقت الاستلام.',
  delivery_not_available: 'هذه المنشأة لا توفر توصيل.',
  pickup_not_available: 'هذه المنشأة لا توفر استلام.',
  restaurant_unavailable: 'المنشأة غير متاحة حالياً.',
  gift_not_found: 'الهدية غير موجودة.'
};

$('#submit').onclick = async () => {
  const name = $('#cname').value.trim();
  const phone = $('#cphone').value.trim();
  if (!name) return toast('أدخل الاسم');
  if (!/^05\d{8}$/.test(phone.replace(/[\s-]/g, ''))) return toast('أدخل رقم جوال صحيح يبدأ بـ 05');
  if (!$('#c1').checked) return toast('الموافقة على مشاركة الرقم مطلوبة');
  if (otype() === 'pickup' && !R.pickup_enabled) return toast('هذه المنشأة لا توفر استلام');
  if (otype() === 'delivery' && !R.delivery_enabled) return toast('هذه المنشأة لا توفر توصيل');
  if (otype() === 'delivery' && !$('#caddr').value.trim()) return toast('أدخل العنوان للتوصيل');

  const slotVal = $('#slot')?.value;
  if (otype() === 'pickup' && !slotVal) {
    return toast('المنشأة لم تحدد أوقات استلام — تواصل معه أو غداً');
  }

  localStorage.setItem('hg_name', name);
  localStorage.setItem('hg_phone', phone);
  localStorage.setItem('hg_addr', $('#caddr').value.trim());
  setArea($('#carea').value);

  const btn = $('#submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ الإرسال…';

  const { data, error } = await sb.rpc('create_order', {
    p_device: deviceId(),
    p_gift: gift.gift.id,
    p_type: otype(),
    p_items: cart.map(i => ({ item_id: i.id, qty: i.qty })),
    p_name: name,
    p_phone: phone,
    p_area: $('#carea').value ? Number($('#carea').value) : null,
    p_address: $('#caddr').value.trim() || null,
    p_slot: otype() === 'pickup' ? slotVal : null,
    p_note: $('#cnote').value.trim() || null,
    p_consent_order_contact: true,
    p_consent_marketing: $('#c2').checked
  });

  if (error || !data?.ok) {
    btn.disabled = false;
    btn.textContent = 'تأكيد الطلب';
    return toast(ERRORS[data?.error] || 'تعذّر إنشاء الطلب');
  }

  clearCart();
  localStorage.setItem('hg_gift', JSON.stringify({
    ...gift, gift: { ...gift.gift, redeemed: true }
  }));
  toast('✅ تم إرسال الطلب للمطعم');
  setTimeout(() => location.href = `order.html?code=${data.code}`, 700);
};
initPWA();
</script>
</body>
</html>
