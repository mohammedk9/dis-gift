name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow secrets stored under the GitHub Pages environment as well as
    # repository secrets to be read during the build step.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate public Supabase runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const url = (process.env.SUPABASE_URL || '').trim();
          const key = (process.env.SUPABASE_ANON_KEY || '').trim();
          let parsed;
          try { parsed = new URL(url); } catch { parsed = null; }
          if (!parsed || !['http:', 'https:'].includes(parsed.protocol) || !parsed.hostname ||
              parsed.hostname === 'YOUR-PROJECT.supabase.co' || key.length < 20 ||
              key.includes('YOUR-ANON-KEY')) {
            console.error('Missing or invalid Supabase runtime configuration.');
            console.error('Set SUPABASE_URL and SUPABASE_ANON_KEY as repository/environment secrets or variables.');
            process.exit(1);
          }
          const config = { supabaseUrl: url, supabaseAnonKey: key };
          fs.writeFileSync(
            'assets/js/runtime-config.js',
            'window.__HADIYA_CONFIG__ = Object.freeze(' + JSON.stringify(config) + ');\n',
            'utf8'
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4