name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow secrets stored under the GitHub Pages environment as well as
    # repository secrets to be read during the build step.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate public Supabase runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const url = (process.env.SUPABASE_URL || '').trim();
          const key = (process.env.SUPABASE_ANON_KEY || '').trim();
          let parsed;
          try { parsed = new URL(url); } catch { parsed = null; }
          if (!parsed || !['http:', 'https:'].includes(parsed.protocol) || !parsed.hostname ||
              parsed.hostname === 'YOUR-PROJECT.supabase.co' || key.length < 20 ||
              key.includes('YOUR-ANON-KEY')) {
            console.error('Missing or invalid Supabase runtime configuration.');
            console.error('Set SUPABASE_URL and SUPABASE_ANON_KEY as repository/environment secrets or variables.');
            process.exit(1);
          }
          const output = 'assets/js/runtime-config-live.js';
          const config = { supabaseUrl: url, supabaseAnonKey: key, configSource: 'github-actions' };
          const source = 'window.__HADIYA_CONFIG__ = Object.freeze(' + JSON.stringify(config) + ');\n';
          fs.writeFileSync(output, source,
            'utf8'
          );
          const generated = fs.readFileSync(output, 'utf8');
          if (!generated.includes(url) || !generated.includes(key) ||
              !generated.includes('configSource:') && !generated.includes('"configSource":"github-actions"')) {
            console.error('Generated runtime config does not contain the validated deployment values.');
            process.exit(1);
          }
          console.log('Supabase runtime config generated:', {
            url: parsed.origin,
            anonKeyLength: key.length,
            output
          });
          NODE

      # Some repositories still have Pages configured as "Deploy from a
      # branch". Keep the public browser config in that branch too, so that
      # branch-based Pages cannot silently publish the placeholder file.
      - name: Sync public config for branch-based Pages
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/runtime-config-live.js; then
            echo "Public runtime config is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/runtime-config-live.js
          git commit -m 'chore: sync public Supabase runtime config [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4