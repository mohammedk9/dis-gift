<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العروض | الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="./"><span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">العروض</span></span></a>
</div></header>
<div id="tabs"></div>
<main class="container" id="app" style="padding-bottom:40px"></main>
<script src="../assets/js/runtime-config-live.js"></script>
<script src="../assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, dt } from '../assets/js/core.js';
import { $, esc, toast, requireConfig, guardAdmin } from '../assets/js/ui.js';

if (!requireConfig()) throw new Error('not configured');
if (!await guardAdmin()) throw new Error('unauthorized');

$('#tabs').innerHTML = `<div class="container"><div class="tabs">
  ${[['d','المؤشرات','./'],['r','المطاعم','./restaurants.html'],
     ['o','الطلبات','./orders.html'],['f','العروض','./offers.html'],
     ['l','دفتر الحسابات','./ledger.html'],['s','كشوف الحساب','./statements.html'],
     ['g','الإعدادات','./settings.html']].map(([k,l,h]) =>
    `<a class="tab ${k==='f'?'active':''}" href="${h}">${l}</a>`).join('')}
</div></div>`;

const { data } = await sb.rpc('admin_all_offers');
const list = data?.offers || [];

const KIND_AR = {
  percent:      (o) => `خصم ${Number(o.min_value)}% — ${Number(o.max_value)}%`,
  fixed_amount: (o) => `مبلغ ${Number(o.min_value)} — ${Number(o.max_value)} ر.س`,
  free_item:    (o) => `🎁 ${o.gift_label || 'صنف مجاني'}`
};
const BIZ_AR = {
  restaurant: '🍽️ مطعم', cafe: '☕ كافيه', salon: '💇 صالون',
  store: '🏪 متجر', services: '🛠️ خدمات', other: '📦 أخرى'
};

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">العروض والهدايا</h1>
    <p class="page-sub">${list.length} عرض</p>
  </div>
  <div class="alert alert-info">يمكنك إيقاف أي عرض فوراً دون تعديل كود.
    المنشأة تختار نوع الهدية ونطاقها بنفسها — يمكنك إيقاف ما لا توافق عليه فقط.</div>

  <div class="card" style="padding:0">
    <div class="table-wrap"><table>
      <thead><tr><th>المنشأة</th><th>النوع</th><th>الهدية</th><th>الحد اليومي</th><th>اليوم</th>
        <th>الحالة</th><th></th></tr></thead>
      <tbody>
        ${list.map(o => `<tr>
          <td><b>${esc(o.restaurant)}</b>
            <br><span class="small muted">${esc(o.title)}</span></td>
          <td>${BIZ_AR[o.business_type] || '—'}</td>
          <td dir="rtl">${esc(KIND_AR[o.kind] ? KIND_AR[o.kind](o) : '—')}</td>
          <td>${o.daily_limit}</td>
          <td>${o.redeemed_today}</td>
          <td><span class="badge ${o.is_enabled ? 'badge-green' : 'badge-red'}">
            ${o.is_enabled ? 'مفعّل' : 'موقوف'}</span></td>
          <td><button class="btn btn-ghost btn-sm" data-t="${o.id}" data-v="${o.is_enabled}">
            ${o.is_enabled ? 'إيقاف' : 'تفعيل'}</button></td>
        </tr>`).join('') || '<tr><td colspan="7" class="center muted">لا توجد عروض</td></tr>'}
      </tbody>
    </table></div>
  </div>`;

$('#app').querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
  const { data: r } = await sb.rpc('admin_set_offer',
    { p_id: b.dataset.t, p_enabled: b.dataset.v !== 'true' });
  if (r?.ok) { toast('تم التحديث'); setTimeout(() => location.reload(), 300); }
  else toast('تعذّر التحديث');
});
</script>
</body>
</html>
