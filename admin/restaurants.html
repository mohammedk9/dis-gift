<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المطاعم | الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="./"><span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">المطاعم</span></span></a>
</div></header>
<div id="tabs"></div>
<main class="container" id="app" style="padding-bottom:40px"></main>
<script src="../assets/js/runtime-config-live.js"></script>
<script src="../assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, sar, RSTATUS_AR } from '../assets/js/core.js';
import { $, esc, toast, requireConfig, guardAdmin } from '../assets/js/ui.js';

if (!requireConfig()) throw new Error('not configured');
if (!await guardAdmin()) throw new Error('unauthorized');

$('#tabs').innerHTML = `<div class="container"><div class="tabs">
  ${[['d','المؤشرات','./'],['r','المطاعم','./restaurants.html'],
     ['o','الطلبات','./orders.html'],['f','العروض','./offers.html'],
     ['l','دفتر الحسابات','./ledger.html'],['s','كشوف الحساب','./statements.html'],
     ['g','الإعدادات','./settings.html']].map(([k,l,h]) =>
    `<a class="tab ${k==='r'?'active':''}" href="${h}">${l}</a>`).join('')}
</div></div>`;

const { data } = await sb.rpc('admin_list_restaurants');
const list = data?.restaurants || [];
const pending = list.filter(r => r.status === 'pending');

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">المطاعم</h1>
    <p class="page-sub">${list.length} مطعم · ${pending.length} بانتظار التفعيل</p>
  </div>

  ${pending.length ? `<div class="alert alert-warn">
    ${pending.length} مطعم ينتظر التفعيل. التفعيل يجعل عروضه مرئية للعميل.</div>` : ''}

  ${list.length ? list.map(r => `
    <div class="card mb">
      <div class="between">
        <div class="grow">
          <div style="font-weight:700">${esc(r.name)}</div>
          <div class="small muted">${esc(r.area || 'بدون حي')} · ${esc(r.address || '')}</div>
          <div class="small muted" dir="ltr" style="text-align:right">${esc(r.phone || '')}</div>
        </div>
        <span class="badge ${r.status === 'active' ? 'badge-green'
          : r.status === 'pending' ? 'badge-orange' : 'badge-red'}">
          ${RSTATUS_AR[r.status]}</span>
      </div>

      <div class="flex mt" style="gap:6px;flex-wrap:wrap">
        <span class="badge">${r.active_offers}/${r.offers} عروض مفعّلة</span>
        <span class="badge">${r.orders} طلب</span>
        <span class="badge">${r.completed} مكتمل</span>
        <span class="badge badge-orange">رسوم: ${sar(r.fees)}</span>
        ${r.pickup_enabled ? '<span class="badge badge-green">استلام</span>' : ''}
        ${r.delivery_enabled ? '<span class="badge badge-blue">توصيل المنشأة</span>' : ''}
      </div>

      <div class="flex mt" style="gap:8px">
        ${r.status !== 'active' ? `<button class="btn btn-primary btn-sm grow"
          data-activate="${r.id}">تفعيل</button>` : ''}
        ${r.status === 'active' ? `<button class="btn btn-red btn-sm grow"
          data-suspend="${r.id}">إيقاف</button>` : ''}
        ${r.status !== 'hidden' ? `<button class="btn btn-ghost btn-sm grow"
          data-hide="${r.id}">إخفاء</button>` : ''}
      </div>
    </div>`).join('')
  : '<div class="empty"><div class="empty-ico">🏪</div><p>لا توجد مطاعم مسجلة بعد.</p></div>'}`;

$('#app').querySelectorAll('[data-activate]').forEach(b => b.onclick = () => set(b, 'active'));
$('#app').querySelectorAll('[data-suspend]').forEach(b => b.onclick = () => set(b, 'suspended'));
$('#app').querySelectorAll('[data-hide]').forEach(b => b.onclick = () => set(b, 'hidden'));

async function set(b, st) {
  const { data: r } = await sb.rpc('admin_set_restaurant',
    { p_id: b.dataset[Object.keys(b.dataset)[0]], p_status: st });
  if (r?.ok) { toast('تم التحديث'); setTimeout(() => location.reload(), 300); }
  else toast('تعذّر التحديث');
}
</script>
</body>
</html>
