<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدية اليوم | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e86a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="هدية">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="index.html">
    <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg></span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">اكتشف · اطلب</span></span>
  </a>
  <span class="nav-spacer"></span>
  <button class="btn btn-ghost btn-sm" id="areaBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> <span id="areaLabel">كل بريدة</span></button>
</div></header>

<main class="container page" id="app">
  <div class="page-head center">
    <p style="color:var(--orange);font-size:13px;font-weight:600;margin:0">بريدة — اليوم</p>
  </div>
  <div id="stage"></div>
</main>

<div id="nav"></div>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, actorId, areaId, setArea, getGift, setGift, sar } from './assets/js/core.js';
import { $, esc, toast, modal, requireConfig, customerNav, initPWA, guardCustomer } from './assets/js/ui.js';

$('#nav').innerHTML = customerNav('gift');
if (!requireConfig()) throw new Error('not configured');
/* كود الهدية لا يظهر إلا لصاحب حساب — الزائر يُحوَّل إلى الدخول */
if (!await guardCustomer()) throw new Error('redirecting');

let areas = [];
const stage = $('#stage');

async function loadAreas() {
  const { data } = await sb.rpc('active_areas');
  areas = data || [];
  renderAreaLabel();
}
function renderAreaLabel() {
  const a = areas.find(x => x.id === areaId());
  $('#areaLabel').textContent = a ? a.name : 'كل بريدة';
}
$('#areaBtn').onclick = () => {
  const close = modal(`
    <h3 class="modal-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;margin-left:4px;vertical-align:text-bottom" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> اختر حيّك</h3>
    <p class="hint mb">نستخدم الحي لعرض مطاعم وعروض قريبة منك فقط.</p>
    <label class="check"><input type="radio" name="ar" value="" ${areaId() ? '' : 'checked'}> كل بريدة</label>
    ${areas.map(a => `<label class="check"><input type="radio" name="ar" value="${a.id}"
      ${areaId() === a.id ? 'checked' : ''}> ${esc(a.name)}</label>`).join('')}
    <button class="btn btn-primary btn-block mt" id="ar-save">حفظ</button>`);
  const m = document.querySelector('.modal-bg:last-child .modal');
  m.querySelector('#ar-save').onclick = () => {
    setArea(m.querySelector('input[name=ar]:checked')?.value || '');
    renderAreaLabel(); close(); render();
  };
};

function stageClosed() {
  return `
    <div class="card" style="background:linear-gradient(135deg,#f59653,#e5551f);color:#fff;border:0">
      <div class="center">
        <div style="font-size:56px;line-height:1;margin-bottom:6px"><svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg></div>
        <h1 style="font-size:24px;font-weight:700;margin:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:inline;margin-left:4px;vertical-align:text-bottom" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg> هدية اليوم</h1>
        <p style="margin:8px 0 0;opacity:.9;font-size:14px">
          كل يوم لك هدية من منشأة قريبة منك. قيمة الهدية تُكشف عند الفتح فقط.</p>
        <div style="height:1px;background:rgba(255,255,255,.3);margin:20px 0 14px"></div>
        <button class="btn btn-lg" id="openBtn"
          style="background:#fff;color:var(--orange-deep)">افتح هديتك</button>
        <p style="margin:16px 0 0;font-size:11.5px;opacity:.85">هدية واحدة يومياً لكل جهاز</p>
      </div>
    </div>

    <div class="card mt">
      <div class="between">
        <div>
          <div style="font-weight:700">كيف تعمل؟</div>
          <div class="small muted">افتح · اكتشف · اطلب مباشرة</div>
        </div>
        <span class="badge badge-orange">بلا تسجيل</span>
${[[1,'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg>','افتح هدية واحدة كل يوم'],
           [2,'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>','تظهر لك هدية من منشأة قريبة'],
           [3,'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>','اطلب من قائمتها مباشرة'],
           [4,'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>','الدفع يتم مباشرة مع المنشأة']].map(([n,ico,t]) => `
          <div class="flex" style="gap:10px;align-items:center">
            <span style="width:30px;height:30px;border-radius:9px;background:var(--peach);
              color:var(--orange-deep);display:grid;place-items:center;font-size:0">${ico}</span>
            <span class="small">${t}</span>
            <span class="nav-spacer badge">${n}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function stageNoOffer() {
  return `
    <div class="card center">
      <div style="font-size:44px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 2h12M6 2a1 1 0 0 0-1 1v3h14V3a1 1 0 0 0-1-1M6 5h12M9 9v7a3 3 0 0 0 6 0V9M7 16h10"/></svg></div>
      <h2 style="font-size:19px;font-weight:700;margin:10px 0 4px">لا توجد هدية متاحة حالياً</h2>
      <p class="muted small">حاول لاحقاً. قد تكون عروض اليوم قد انتهت أو أن المنشآت القريبة
        نفدت من عروضها.</p>
      <button class="btn btn-ghost mt" onclick="location.reload()">تحديث</button>
    </div>`;
}

function stageOpened(d) {
  const g = d.gift, r = d.restaurant, o = d.offer || {};

  // الهدية قد تكون: خصم % / مبلغ ثابت / صنف مجاني
  let bigValue, bigUnit, headline;
  if (g.kind === 'free_item') {
    bigValue = '<svg class="ico" width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg>';
    bigUnit = '';
    headline = g.gift_label || 'صنف مجاني';
  } else if (g.kind === 'fixed_amount') {
    bigValue = esc(g.discount);
    bigUnit = 'ر.س';
    headline = `هدية بمبلغ ثابت من ${esc(r.name)}`;
  } else {
    bigValue = esc(g.discount);
    bigUnit = '%';
    headline = `خصم من ${esc(r.name)}`;
  }

  return `
    <div class="reveal">
      <div class="gift-box"><svg width="46" height="46" viewBox="0 0 24 24" fill="white"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg></div>
      <p class="small muted" style="margin:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:inline;margin-left:4px;vertical-align:text-bottom" aria-hidden="true"><path d="M9 2c-1.1 0-2 .9-2 2v2h10V4c0-1.1-.9-2-2-2h-6zM4 7v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7H4zm3 4h2v5H7v-5zm4 0h2v5h-2v-5zm4 0h2v5h-2v-5z"/></svg> هديتك اليوم</p>
      <div class="discount-value">${bigValue}
        ${bigUnit ? `<span style="font-size:24px">${bigUnit}</span>` : ''}</div>
      <p style="margin:2px 0 0;font-weight:600">${headline}</p>
    </div>

    <div class="card mt">
      <div class="flex" style="gap:12px;align-items:center">
        ${r.logo_url ? `<img src="${esc(r.logo_url)}" alt=""
            style="width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none">`
          : `<div style="width:56px;height:56px;border-radius:14px;background:var(--peach);
              color:var(--orange-deep);display:grid;place-items:center;font-size:0;flex:none"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2"/><polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2"/></svg></div>`}
        <div class="grow">
          <div style="font-weight:700;font-size:16px">${esc(r.name)}</div>
          <div class="small muted">${esc(r.address || 'بريدة')}</div>
        </div>
      </div>

      ${o.title ? `<p class="small muted mt">${esc(o.title)}</p>` : ''}
      ${o.description ? `<p class="small muted">${esc(o.description)}</p>` : ''}

      ${g.kind === 'free_item' ? `<div class="alert alert-ok mt">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8.5 12.5 2.5 2.5 4.5-5" stroke="#fff" stroke-width="2"/></svg> ستُضاف هديتك للطلب تلقائياً عند إتمام الطلب.
        ${g.gift_label ? '<br><b>' + esc(g.gift_label) + '</b>' : ''}</div>` : ''}

      <div class="flex mt" style="gap:8px;flex-wrap:wrap">
        ${r.pickup_enabled ? '<span class="badge badge-green">استلام متاح</span>' : ''}
        ${r.delivery_enabled ? `<span class="badge badge-blue">توصيل المنشأة${
          Number(r.delivery_fee) > 0 ? ' · ' + sar(r.delivery_fee) : ' · بلا رسوم'}</span>` : ''}
        <span class="badge">التحضير ~${esc(r.prep_time_min)} دقيقة</span>
        ${o.expires_at ? `<span class="badge badge-orange">ينتهي ${new Date(o.expires_at)
          .toLocaleDateString('ar-SA')}</span>` : ''}
      </div>

      <button class="btn btn-primary btn-block btn-lg mt" id="orderNow">اطلب الآن</button>
      ${g.redeemed ? '<div class="alert alert-ok mt mb">تم استخدام هذه الهدية في طلب.</div>' : ''}
      <p class="hint center mt">الدفع يتم مباشرة مع المنشأة. لا يوجد دفع إلكتروني عبر المنصة.</p>
    </div>`;
}

async function render() {
  const cached = getGift();
  if (cached) { stage.innerHTML = stageOpened(cached); wire(cached); return; }
  stage.innerHTML = stageClosed();
  $('#openBtn').onclick = open;
}

const redirectToLogin = () => location.replace(
  'login.html?mode=customer&next=' + encodeURIComponent(location.pathname + location.search));

const OPEN_ERRORS = {
  auth_required: null,        // جلسة منتهية ⇒ إعادة إلى الدخول
  device_required: null,      // بقايا الواجهة القديمة ⇒ إعادة إلى الدخول
  no_offers_available: null   // له رسالة ودّية خاصة
};

async function open() {
  const btn = $('#openBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ الفتح…';
  const { data, error } = await sb.rpc('open_daily_gift', {
    p_device: actorId(), p_area: areaId()
  });
  if (error) {
    // جلسة غير صالحة: نعيد المستخدم إلى الدخول بدل رسالة غامضة
    if (/auth_required/.test(error.message || '')) return redirectToLogin();
    stage.innerHTML = stageError('تعذّر فتح الهدية');
    return;
  }
  if (!data?.ok) {
    if (data?.error === 'auth_required' || data?.error === 'device_required') return redirectToLogin();
    if (data.error === 'no_offers_available') { stage.innerHTML = stageNoOffer(); return; }
    stage.innerHTML = stageError(
      OPEN_ERRORS[data.error] || 'تعذّر فتح الهدية حالياً');
    return;
  }
  setGift(data);
  stage.innerHTML = stageOpened(data);
  wire(data);
  toast('لديك هدية اليوم!');
}

function stageError(msg) {
  return `<div class="card center">
    <div style="font-size:40px"><svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg></div>
    <h2 style="font-size:18px;font-weight:700;margin:10px 0 4px">${esc(msg)}</h2>
    <button class="btn btn-ghost mt" onclick="location.reload()">إعادة المحاولة</button>
  </div>`;
}

function wire(d) {
  $('#orderNow')?.addEventListener('click', () => {
    if (d.gift.redeemed) { location.href = 'orders.html'; return; }
    location.href = 'menu.html';
  });
}

await loadAreas();
await render();
initPWA();
</script>
</body>
</html>
