<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التنبيهات | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="gift.html">
    <span class="brand-mark">🎁</span>
    <span><span class="brand-name">هدية</span><br><span class="brand-sub">التنبيهات</span></span>
  </a>
</div></header>
<main class="container page" id="app"></main>
<div id="nav"></div>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, dt } from './assets/js/core.js';
import { $, esc, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

$('#nav').innerHTML = customerNav('notif');
if (!requireConfig()) throw new Error('not configured');

const { data } = await sb.rpc('customer_notifications', { p_device: deviceId() });
const list = data || [];

$('#app').innerHTML = `
  <div class="page-head">
    <h1 class="page-title">التنبيهات</h1>
    <p class="page-sub">آخر ${list.length} إشعار</p>
  </div>
  ${list.length ? list.map(n => `
    <div class="card card-tight mb">
      <div class="between">
        <div style="font-weight:600">${esc(n.title)}</div>
        <span class="small muted">${dt(n.at)}</span>
      </div>
      ${n.body ? `<div class="small muted">${esc(n.body)}</div>` : ''}
    </div>`).join('')
  : `<div class="empty"><div class="empty-ico">🔔</div>
     <p>لا توجد تنبيهات بعد.</p></div>`}`;

if (list.length) setTimeout(() => location.reload(), 15000);
initPWA();
</script>
</body>
</html>
