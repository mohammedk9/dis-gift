<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التنبيهات | هدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<meta name="theme-color" content="#e86a33">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  /* ===== الهوية البرتقالية (متوافقة مع بقية الصفحات) ===== */
  :root{
    --orange:#e86a33; --orange-deep:#d9531a; --orange-text:#b94110; --orange-light:#f7a05f;
    --peach:#fdeee3; --peach-2:#fbe0cd; --cream:#fff8f1;
    --grad:linear-gradient(135deg,#f7a05f 0%,#ee6f33 48%,#d9531a 100%);
    --shadow-or:0 18px 38px -16px rgba(226,85,31,.55);
    --card-shadow:0 1px 2px rgba(26,19,14,.04),0 12px 32px -18px rgba(26,19,14,.16);
  }
  [hidden]{display:none !important}
  body{font-family:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
       background:linear-gradient(180deg,var(--cream) 0,#fff 360px) no-repeat,#fff}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid #f3e9dd}
  header.nav::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--orange-light),var(--orange),var(--orange-light),transparent);opacity:.55}
  header.nav .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;
    display:grid;place-items:center;box-shadow:var(--shadow-or);font-size:0;flex:none}
  .brand-text{display:flex;flex-direction:column}
  .brand-name{font-size:20px;font-weight:700;line-height:1.1}
  .brand-sub{font-size:12px;color:#867b71;line-height:1.4}

  /* رأس الصفحة */
  .n-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 18px}
  .n-head .page-title{margin:0;font-weight:700}
  .n-count{background:var(--peach);color:var(--orange-text);border:1px solid var(--peach-2);
    font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;white-space:nowrap}

  /* التنبيه */
  .notice{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid #f1e7da;border-radius:20px;
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--card-shadow);transition:.2s}
  .notice:hover{border-color:var(--peach-2);box-shadow:0 16px 30px -22px rgba(226,85,31,.45)}
  .n-head + .notice{border-color:var(--peach-2);background:linear-gradient(180deg,#fff,var(--cream))}
  .notice-ico{width:42px;height:42px;border-radius:14px;background:var(--peach);color:var(--orange-deep);
    display:grid;place-items:center;flex:none;border:1px solid var(--peach-2)}
  .notice-main{flex:1;min-width:0}
  .notice-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .notice-title{margin:0;font-weight:600;font-size:15px;line-height:1.6}
  .notice-time{color:#867b71;font-size:12px;white-space:nowrap}
  .notice-body{margin:3px 0 0;color:#6f655c;font-size:13.5px;line-height:1.85}

  /* حالة فارغة */
  .state-card{margin-top:14px;border-radius:26px;border:1px solid #f1e7da;background:#fff;padding:38px 22px;
    text-align:center;box-shadow:var(--card-shadow)}
  .state-ico{width:72px;height:72px;margin:0 auto 12px;border-radius:24px;background:var(--peach);
    color:var(--orange-deep);display:grid;place-items:center;border:1px solid var(--peach-2)}
  .state-card h2{margin:6px 0 4px;font-size:18px;font-weight:700}
  .state-card p{color:#6f655c;font-size:14px;margin:0}

  a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:10px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="gift.html">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>
      </svg>
    </span>
    <span class="brand-text"><span class="brand-name">هدية</span><span class="brand-sub">التنبيهات</span></span>
  </a>
</div></header>
<main class="container page" id="app"></main>
<div id="nav"></div>
<script src="assets/js/runtime-config-live.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script type="module">
import { sb, deviceId, dt } from './assets/js/core.js';
import { $, esc, requireConfig, customerNav, initPWA } from './assets/js/ui.js';

$('#nav').innerHTML = customerNav('notif');
if (!requireConfig()) throw new Error('not configured');

/* أيقونات SVG بدل الإيموجي */
const svg = (inner, s = 22, sw = 1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  bell: (s, sw) => svg(`<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>`, s, sw)
};

const { data } = await sb.rpc('customer_notifications', { p_device: deviceId() });
const list = data || [];

$('#app').innerHTML = `
  <div class="n-head">
    <h1 class="page-title">التنبيهات</h1>
    <span class="n-count">آخر ${list.length} إشعار</span>
  </div>
  ${list.length ? list.map(n => `
    <div class="notice">
      <span class="notice-ico">${ICON.bell(20)}</span>
      <div class="notice-main">
        <div class="notice-top">
          <p class="notice-title">${esc(n.title)}</p>
          <span class="notice-time">${dt(n.at)}</span>
        </div>
        ${n.body ? `<p class="notice-body">${esc(n.body)}</p>` : ''}
      </div>
    </div>`).join('')
  : `<div class="state-card">
      <div class="state-ico">${ICON.bell(34, 1.6)}</div>
      <h2>لا توجد تنبيهات بعد</h2>
    </div>`}`;

if (list.length) setTimeout(() => location.reload(), 15000);
initPWA();
</script>
</body>
</html>
